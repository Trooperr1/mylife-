/* =============================== EXPORTER =============================== */
const Exporter = {
  stamp: () => D.today(),
  htmlToText(html) { const d = new DOMParser().parseFromString('<body>' + (html || '') + '</body>', 'text/html'); const out = []; const walk = (n, pre = '') => { n.childNodes.forEach(c => { if (c.nodeType === 3) out.push(c.nodeValue); else if (c.nodeType === 1) { const t = c.tagName; if (t === 'BR') out.push('\n'); else if (t === 'LI') { out.push('\n' + pre + (c.classList.contains('checked') ? '[x] ' : c.parentElement && c.parentElement.classList.contains('checklist') ? '[ ] ' : '- ')); walk(c, pre + '  '); } else if (/^H[1-3]$/.test(t)) { out.push('\n\n' + '#'.repeat(+t[1]) + ' '); walk(c, pre); out.push('\n'); } else if (['P', 'DIV', 'BLOCKQUOTE', 'PRE'].includes(t)) { out.push('\n'); walk(c, pre); out.push('\n'); } else if (t === 'HR') out.push('\n---\n'); else walk(c, pre); } }); }; walk(d.body); return out.join('').replace(/\n{3,}/g, '\n\n').trim(); },
  tasksCsv() { const rows = [['Title', 'Status', 'Priority', 'Due date', 'Due time', 'Category', 'Tags', 'Project', 'Business', 'Goal', 'Repeat', 'Subtasks', 'Description', 'Notes', 'Created', 'Completed', 'Archived']]; Store.all('tasks').forEach(t => rows.push([t.title, labelOf(TASK_STATUS, t.status), t.priority, t.due, t.dueTime, t.category, (t.tags || []).join('; '), titleOf('projects', Store.get('projects', t.projectId)), titleOf('businesses', Store.get('businesses', t.businessId)), titleOf('goals', Store.get('goals', t.goalId)), t.repeat, (t.subtasks || []).map(s => (s.done ? '[x] ' : '[ ] ') + s.text).join(' | '), t.description, t.notes, new Date(t.createdAt).toISOString(), t.doneAt ? new Date(t.doneAt).toISOString() : '', t.archived ? 'yes' : ''])); U.download(`tasks-${this.stamp()}.csv`, U.csv(rows), 'text/csv'); Toast.show('Tasks exported'); },
  txCsv() { const rows = [['Date', 'Type', 'Category', 'Description', 'Amount', 'Currency', `Amount in ${Settings.get('currency')}`, 'Tags', 'Note']]; U.sortBy(Store.all('transactions'), t => t.date).forEach(t => { const b = Money.toBase(t.amount, t.currency); rows.push([t.date, t.kind, t.category, t.description, (t.kind === 'expense' ? -1 : 1) * t.amount, t.currency || Settings.get('currency'), b == null ? '' : (t.kind === 'expense' ? -1 : 1) * U.round2(b), (t.tags || []).join('; '), t.note]); }); U.download(`personal-transactions-${this.stamp()}.csv`, U.csv(rows), 'text/csv'); Toast.show('Transactions exported'); },
  bizCsv(id) { const b = Store.get('businesses', id); const rows = [['Date', 'Type', 'Category', 'Description', 'Customer / supplier', 'Invoice no.', 'Status', 'Due date', 'Amount', 'Currency', 'Project', 'Notes']]; U.sortBy(Biz.tx(id), x => x.date).forEach(x => rows.push([x.date, x.kind, x.category, x.description, x.counterparty, x.invoiceNo, x.status || 'paid', x.dueDate, (x.kind === 'expense' ? -1 : 1) * x.amount, x.currency || b.currency, titleOf('projects', Store.get('projects', x.projectId)), x.notes])); U.download(`${(b.name || 'business').replace(/[^\w\-]+/g, '-')}-transactions-${this.stamp()}.csv`, U.csv(rows), 'text/csv'); Toast.show('Business transactions exported'); },
  bizReport(id, year) { const b = Store.get('businesses', id); year = year || D.today().slice(0, 4); const rows = [[`${b.name} — annual financial report ${year}`], [`Currency: ${b.currency || Settings.get('currency')}`], [], ['Month', 'Investment', 'Revenue', 'Expenses', 'Profit / loss', 'Cumulative cash flow']]; let cum = 0; for (let i = 1; i <= 12; i++) { const mk = `${year}-${D.pad(i)}`; const s = Biz.stats(id, mk); cum += s.invested + s.revenue - s.expenses; rows.push([mk, s.invested, s.revenue, s.expenses, s.profit, U.round2(cum)]); } const all = Biz.stats(id); rows.push([], ['All-time totals'], ['Invested', all.invested], ['Revenue', all.revenue], ['Expenses', all.expenses], ['Profit', all.profit], ['Cash position', all.cash], ['Open receivables', all.receivable], ['Open payables', all.payable], ['Customers', all.customers]); U.download(`${(b.name || 'business').replace(/[^\w\-]+/g, '-')}-report-${year}.csv`, U.csv(rows), 'text/csv'); Toast.show('Report exported'); },
  allBizReports() { const bs = Store.all('businesses'); if (!bs.length) return Toast.show('No businesses yet'); bs.forEach((b, i) => setTimeout(() => this.bizReport(b.id), i * 400)); },
  contactsCsv() { const rows = [['Name', 'Category', 'Relationship', 'Company', 'Job title', 'Phone', 'Email', 'Birthday', 'Last contact', 'Next follow-up', 'Tags', 'Notes']]; Store.all('contacts').forEach(c => rows.push([c.name, c.category, c.relationship, c.company, c.jobTitle, c.phone, c.email, c.birthday, c.lastContact, c.nextFollowUp, (c.tags || []).join('; '), c.notes])); U.download(`contacts-${this.stamp()}.csv`, U.csv(rows), 'text/csv'); Toast.show('Contacts exported'); },
  notes() { const ns = Store.all('notes'); if (!ns.length) return Toast.show('No notes to export'); const md = ns.map(n => `# ${n.title || 'Untitled'}\n\n_${n.category || ''}${n.folder ? ' · ' + n.folder : ''}${(n.tags || []).length ? ' · ' + n.tags.map(t => '#' + t).join(' ') : ''} · updated ${new Date(n.updatedAt).toISOString().slice(0, 16).replace('T', ' ')}_\n\n${this.htmlToText(n.content)}\n`).join('\n\n---\n\n'); U.download(`notes-${this.stamp()}.md`, md, 'text/markdown'); Toast.show('Notes exported as Markdown'); },
  journal() { const js = U.sortBy(Journal.visible(), j => j.date + (j.time || '')); if (!js.length) return Toast.show('No journal entries to export'); const all = [...JOURNAL_PROMPTS.map(p => ['a_' + p[0], p[1]]), ...MONTHLY_PROMPTS.map(p => ['m_' + p[0], p[1]]), ...YEARLY_PROMPTS.map(p => ['y_' + p[0], p[1]])]; const txt = js.map(j => `${D.fmt(j.date, 'long')}${j.time ? ' · ' + j.time : ''}${j.title ? ' — ' + j.title : ''}${j.mood ? ' · mood ' + j.mood + '/5' : ''}\n${'='.repeat(40)}\n${all.filter(([k]) => j[k]).map(([k, l]) => `${l}\n${j[k]}\n`).join('\n')}${U.text(j.body) ? '\n' + this.htmlToText(j.body) + '\n' : ''}${(j.tags || []).length ? '\nTags: ' + j.tags.join(', ') + '\n' : ''}`).join('\n\n'); U.download(`journal-${this.stamp()}.txt`, txt); Toast.show(Journal.isLocked() && Store.all('journal').some(j => j.private) ? 'Journal exported (private entries excluded while locked)' : 'Journal exported'); },
  async json(includeFiles) {
    const out = { app: 'my-life-os', version: APP_VERSION, schema: 1, exportedAt: new Date().toISOString(), settings: Settings.s, data: Store.snapshot(), files: {} };
    if (includeFiles) { for (const d of Store.all('documents')) { try { const b = await Store.getFile(d.id); if (b) out.files[d.id] = { mime: b.type || d.mime, data: (await U.fileToDataURL(b)).split(',')[1] }; } catch (_) { } } }
    U.download(`my-life-os-backup-${this.stamp()}.json`, JSON.stringify(out), 'application/json'); Settings.set('lastBackup', Date.now(), true); Toast.show('Backup downloaded — keep it somewhere safe');
  },
  async allDocs() { const ds = Store.all('documents'); if (!ds.length) return Toast.show('No documents'); for (let i = 0; i < ds.length; i++) { await Docs.download(ds[i].id); await new Promise(r => setTimeout(r, 350)); } }
};

/* =============================== BACKUP & RESTORE =============================== */
const Importer = {
  validate(obj) {
    const errs = []; if (!obj || typeof obj !== 'object') return { errs: ['The file does not contain a JSON object.'] };
    if (obj.app !== 'my-life-os') errs.push('This file was not created by My Life OS.');
    if (!obj.data || typeof obj.data !== 'object') errs.push('The backup has no data section.');
    if (errs.length) return { errs };
    const counts = {}; let bad = 0;
    COLLECTIONS.forEach(c => { const v = obj.data[c]; if (v === undefined) return; if (!Array.isArray(v)) { errs.push(`“${c}” is not a list.`); return; } const ok = v.filter(x => x && typeof x === 'object' && typeof x.id === 'string'); bad += v.length - ok.length; obj.data[c] = ok; if (ok.length) counts[c] = ok.length; });
    return { errs, counts, bad, files: Object.keys(obj.files || {}).length };
  },
  pick() { const inp = $('#hiddenFile'); inp.value = ''; inp.multiple = false; inp.accept = '.json,application/json'; inp.onchange = () => inp.files[0] && this.read(inp.files[0]); inp.click(); },
  async read(file) {
    let obj; try { obj = JSON.parse(await file.text()); } catch (e) { return Toast.show('This is not a valid JSON file: ' + e.message, { error: true, ms: 6000 }); }
    const v = this.validate(obj); if (v.errs.length) return Modal.open({ title: 'Cannot import this file', size: 'narrow', body: `<ul>${v.errs.map(e => `<li>${U.esc(e)}</li>`).join('')}</ul>` });
    const existing = U.sum(COLLECTIONS, c => Store.all(c).length);
    const m = Modal.open({ title: 'Import backup', body: `<p class="mb-12">Backup from <b>${obj.exportedAt ? U.esc(new Date(obj.exportedAt).toLocaleString()) : 'unknown date'}</b>${obj.version ? ` (version ${U.esc(obj.version)})` : ''}.</p><div class="table-wrap mb-12"><table class="tbl"><thead><tr><th>Section</th><th class="r">In backup</th><th class="r">Currently</th></tr></thead><tbody>${Object.entries(v.counts).map(([c, n]) => `<tr><td>${U.esc(c)}</td><td class="r num">${n}</td><td class="r num">${Store.all(c).length}</td></tr>`).join('') || '<tr><td colspan="3">The backup contains no records.</td></tr>'}</tbody></table></div>${v.bad ? `<p class="small warn mb-8">${v.bad} invalid records will be skipped.</p>` : ''}${v.files ? `<p class="small mb-8">Includes ${v.files} document files.</p>` : ''}
      <div class="col"><label class="row"><input type="radio" name="mode" value="merge" checked> <span><b>Merge</b> — add records that are not already here; keep everything you have.</span></label><label class="row"><input type="radio" name="mode" value="replace"> <span><b>Replace everything</b> — delete current data (${existing} records) and restore the backup.</span></label><label class="row"><input type="checkbox" class="cb" id="impSettings"> <span>Also restore settings (theme, currency, dashboard layout…)</span></label></div>`, footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Import</button>` });
    m.root.querySelector('[data-go]').onclick = async () => {
      const mode = m.root.querySelector('input[name=mode]:checked').value; const withSettings = m.root.querySelector('#impSettings').checked;
      if (mode === 'replace' && existing && !(await Confirm(`This permanently replaces ${existing} existing records with the backup. Export a backup of the current data first if you might need it. Continue?`, { ok: 'Replace my data', danger: true }))) return;
      try {
        if (mode === 'replace') { Store.load(obj.data); if (Store.mode === 'indexeddb') await IDB.clear('files'); }
        else { let added = 0; COLLECTIONS.forEach(c => (obj.data[c] || []).forEach(x => { if (!Store.get(c, x.id)) { Store.data[c].push(x); added++; } })); if (obj.data.meta && !Store.meta.vision && obj.data.meta.vision) Store.meta.vision = obj.data.meta.vision; Toast.show(`${added} records added`); }
        for (const [id, f] of Object.entries(obj.files || {})) { try { const bin = atob(f.data); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); if (mode === 'replace' || !(await Store.getFile(id))) await Store.putFile(id, new Blob([arr], { type: f.mime })); } catch (e) { console.warn('file restore failed', id, e); } }
        if (withSettings && obj.settings && typeof obj.settings === 'object') { Settings.s = Settings.merge(U.clone(Settings.defaults), obj.settings); Settings.save(); App.theme(); App.sidebar(); App.topbar(); }
        await Store.persist(); m.close(true); Toast.show('Import complete'); Router.go('#/dashboard');
      } catch (e) { console.error(e); Toast.show('Import failed: ' + e.message, { error: true, ms: 8000 }); }
    };
  }
};
V.backup = {
  title: () => T('Backup & Restore'),

      <div class="banner warn">${I('alert', 'sm')}<span class="grow"><b>Important:</b> all data is stored locally in this browser (IndexedDB + localStorage). It can be lost if you clear browsing data, use private/incognito mode, or if the browser evicts storage. It is <b>not synchronised</b> between devices or browsers. Export a backup regularly and keep it somewhere safe (e.g. an encrypted drive).</span></div>
      <div class="grid g2 mb-16">${H.card('Export complete backup (JSON)', `<p class="small muted mb-12">Everything — tasks, journal, goals, businesses, finances, notes, settings — in one file you can import later or on another device.</p><label class="row small mb-12"><input type="checkbox" class="cb" id="bkFiles" ${docSize < 80e6 ? 'checked' : ''}>Include uploaded documents (${U.bytes(docSize)})</label><button class="btn primary" data-a="bk-export">${I('download', 'sm')}Download backup</button><p class="tiny faint mt-12">${last ? 'Last backup: ' + D.stamp(last) + ' (' + D.ago(last) + ')' : 'No backup made yet.'}</p>`, { icon: 'database' })}${H.card('Restore from backup', `<p class="small muted mb-12">Choose a My Life OS JSON backup. The file is validated first; you then decide whether to merge it with your current data or replace everything. Nothing is overwritten without confirmation.</p><button class="btn" data-a="bk-import">${I('upload', 'sm')}Choose backup file…</button>`, { icon: 'upload' })}</div>
      ${H.card('Export individual sections', `<div class="row wrap"><button class="btn sm" data-a="tasks-csv">${I('download', 'sm')}Tasks (CSV)</button><button class="btn sm" data-a="tx-csv">${I('download', 'sm')}Personal expenses & income (CSV)</button><button class="btn sm" data-a="bk-bizall">${I('download', 'sm')}Business reports (CSV, one per business)</button>${Store.all('businesses').map(b => `<button class="btn sm" data-a="biz-csv" data-id="${b.id}">${I('download', 'sm')}${U.esc(U.trunc(b.name, 18))} transactions</button>`).join('')}<button class="btn sm" data-a="notes-export">${I('download', 'sm')}Notes (Markdown)</button><button class="btn sm" data-a="journal-export">${I('download', 'sm')}Journal (text)</button><button class="btn sm" data-a="contacts-csv">${I('download', 'sm')}Contacts (CSV)</button><button class="btn sm" data-a="bk-docs">${I('download', 'sm')}Download all documents (${Store.all('documents').length})</button></div>`, { icon: 'download', cls: 'mb-16' })}
      <div class="grid g2 mb-16">${H.card('Backup reminder', `<div class="row"><span class="small grow">Remind me to back up every</span>${H.select('bd', [{ v: 0, l: 'Never' }, { v: 3, l: '3 days' }, { v: 7, l: '7 days' }, { v: 14, l: '14 days' }, { v: 30, l: '30 days' }], Settings.get('backupDays'), 'data-ch="setting-num" data-k="backupDays"')}</div><p class="tiny faint mt-8">The reminder appears on the dashboard and in Notifications.</p>`, { icon: 'bell' })}${H.card('What is stored', `<div class="small">${counts.map(([c, n]) => `<span class="badge" style="margin:2px">${U.esc(c)}: ${n}</span>`).join('') || 'Nothing yet.'}</div><p class="tiny faint mt-12" id="storageEst">Storage mode: ${Store.mode === 'indexeddb' ? 'IndexedDB (recommended)' : 'localStorage fallback (limited to ~5 MB; documents are not persisted)'}</p>`, { icon: 'info' })}</div>
      ${H.card('<span class="neg">Danger zone</span>', `<p class="small muted mb-12">Permanently delete all data and settings from this browser. Export a backup first.</p><button class="btn danger" data-a="bk-wipe">${I('trash', 'sm')}Delete all data…</button>`, { icon: 'alert' })}`;
  },
  after() { Settings_storageEstimate('storageEst'); }
};
function Settings_storageEstimate(id) { if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => { const el = document.getElementById(id); if (el) el.textContent += ` · using ${U.bytes(e.usage)} of ~${U.bytes(e.quota)} available`; }).catch(() => { }); }
Object.assign(A, {
  'bk-export': () => Exporter.json($('#bkFiles') && $('#bkFiles').checked),
  'bk-import': () => Importer.pick(),
  'bk-docs': () => Exporter.allDocs(),

    const v = await Ask('Delete all data', 'Type DELETE to permanently erase everything in this browser', '', { ok: 'Erase everything' });
    if (v !== 'DELETE') { if (v != null) Toast.show('Nothing was deleted'); return; }

    else if (s.tab === 'categories') { const kinds = [['task', 'Task categories', TASK_CATS], ['note', 'Note categories', NOTE_CATS], ['expense', 'Expense categories', EXPENSE_CATS], ['income', 'Income categories', INCOME_CATS], ['event', 'Calendar categories', EVENT_CATS.map(e => e.l)], ['contact', 'Contact categories', CONTACT_CATS], ['document', 'Document categories', DOC_CATS], ['habit', 'Habit categories', HABIT_CATS], ['project', 'Project areas', PROJECT_AREAS]]; body = `<p class="small muted mb-12">Add your own categories. Built-in categories stay available. Tags are created freely while editing items.</p><div class="grid g2">${kinds.map(([k, l, base]) => H.card(l, `<div class="chips mb-12">${base.map(x => `<span class="chip" style="cursor:default">${U.esc(x)}</span>`).join('')}${((S.custom || {})[k] || []).map((x, i) => `<span class="chip on">${U.esc(x)}<button data-a="cat-rm" data-k="${k}" data-i="${i}" style="border:0;background:none;color:inherit;cursor:pointer;padding:0 0 0 4px">×</button></span>`).join('')}</div><input class="input sm" placeholder="Add custom category… (Enter)" data-enter="cat-add" data-k="${k}" id="cat_${k}">`)).join('')}</div>`; }
    else body = H.card('', `<div class="row mb-16"><div class="logo" style="width:44px;height:44px;border-radius:12px">${I('compass')}</div><div><h2>My Life OS</h2><div class="small faint">Version ${APP_VERSION} · single-file, local-first personal operating system</div></div></div>
      <dl class="kv"><dt>Storage</dt><dd id="aboutStorage">${Store.mode === 'indexeddb' ? 'IndexedDB (structured data + files) and localStorage (settings)' : 'localStorage fallback — IndexedDB unavailable'}</dd><dt>Persistent storage</dt><dd id="persistState">checking…</dd><dt>Records</dt><dd>${U.sum(COLLECTIONS, c => Store.all(c).length)} across ${COLLECTIONS.length} collections</dd><dt>Privacy</dt><dd>No account, no server, no tracking. Nothing is sent anywhere. Fonts may load from Google Fonts if online (falls back to system fonts offline).</dd><dt>Intelligence</dt><dd>Suggestions, categorisation and summaries use local rules on your data — no AI service is connected.</dd><dt>Security</dt><dd>User content is escaped or sanitised before display. The journal PIN is stored only as a SHA-256 hash; it is a privacy screen, not encryption. Never store passwords or banking credentials in notes or documents.</dd><dt>Shortcuts</dt><dd><span class="kbd">Ctrl K</span> or <span class="kbd">/</span> search · <span class="kbd">Q</span> quick add · <span class="kbd">N</span> new task · <span class="kbd">Esc</span> close · <span class="kbd">Ctrl Enter</span> save form</dd></dl>

  },

};
CH.setting = el => Settings.set(el.dataset.k, el.value);

Object.assign(A, {
  'set-theme': el => Settings.set('theme', el.dataset.v),
  'set-accent': el => Settings.set('accent', el.dataset.v),

});

/* =============================== GETTING STARTED =============================== */
const Guide = {
  html() {
    return `<div style="max-width:820px;margin:0 auto" class="guide">${H.head('Getting started with My Life OS', 'Five minutes to set up the system you will open every morning.', '')}
      <div class="card card-pad prose">
      <h3>1. Your data, on your device</h3><p>Everything you enter is saved automatically in this browser. There is no account and no cloud. Because of that: <b>export a backup regularly</b> (<a href="#/backup">Backup &amp; Restore</a>) and don't clear this site's browsing data. To move to another computer, export a JSON backup and import it there.</p>
      <h3>2. Set up in this order</h3><ol>
        <li><b>Settings</b> — your name, currency (CHF by default), date format and theme.</li>
        <li><b>My Future</b> — write your life vision and your 1-, 3-, 5- and 10-year horizons. Use <i>Plan an ambition</i> to break a big ambition into milestones, a project and first tasks.</li>
        <li><b>Business Hub</b> — create a workspace for each business. Record investments, revenue and expenses in its <i>Finances</i> tab — they never mix with personal money or other businesses.</li>
        <li><b>Finance</b> — add recurring payments (rent, insurance, subscriptions) and monthly budgets per category.</li>
        <li><b>Habits</b>, <b>School</b>, <b>Contacts</b> — add habits, subjects &amp; timetable, and important people with birthdays.</li></ol>
      <h3>3. Every morning</h3><ul><li>Open the <a href="#/dashboard">Dashboard</a>: greeting, priorities, schedule, deadlines, budget and goal progress.</li><li>Go to <a href="#/myday">My Day</a>: choose 1–3 priorities, tick your morning routine, add time blocks.</li></ul>
      <h3>4. During the day</h3><ul><li>Press <span class="kbd">Q</span> (or the + button) to quickly add a task, expense, note, idea, event or reminder from anywhere.</li><li>Press <span class="kbd">Ctrl K</span> to search everything.</li><li>Tasks support subtasks, repeats, reminders and links to projects, businesses and goals. Completing a repeating task schedules the next one.</li></ul>
      <h3>5. Every evening &amp; week</h3><ul><li>Write in <a href="#/journal">My Journal</a> — answer the prompts you like. Lock private entries with a PIN.</li><li>On Sundays, do the <a href="#/weekly">Weekly Review</a>; at the end of each month, the <a href="#/monthly">Monthly Review</a>. Both summarise your real data automatically.</li></ul>
      <h3>How everything connects</h3><p>A <b>business idea</b> → <i>Convert to project</i> or <i>Convert to business</i>. A <b>goal</b> → milestones → <i>Create project</i>. A <b>project</b> → milestones → <i>Create tasks from milestones</i>. Tasks with a due date appear in <b>My Day</b> and the <b>Calendar</b>. Completing tasks updates project progress, which updates goal progress.</p>
      <h3>About reminders</h3><p>Reminders and browser notifications work while the app is open in a tab. If the browser is closed, nothing can be delivered — missed alerts appear in <a href="#/notifications">Notifications</a> when you return.</p>
      <h3>Tips</h3><ul><li>Install it: in Chrome/Edge use “Install app” or create a desktop shortcut; in Safari use “Add to Dock / Home Screen”. Keep the same browser — data belongs to that browser profile.</li><li>Request <i>persistent storage</i> in Settings → About so the browser doesn't evict your data.</li><li>Use the <b>Customize</b> button on the dashboard to rearrange, resize, pin or hide widgets.</li></ul>
      </div></div>`;
  }
};
const Onboarding = {
  open() {
    const m = Modal.open({ title: 'Welcome to My Life OS', guard: false, body: `<p class="muted mb-16">Your private operating system for tasks, calendar, journal, goals, businesses, finances and more. Let's personalise it.</p><div class="form-grid"><div class="field full"><label>What should we call you?</label><input class="input" id="obName" placeholder="Your first name" autofocus></div><div class="field"><label>Main currency</label>${H.select('c', CURRENCIES, Settings.get('currency'), 'id="obCur"').replace('select sm', 'select')}</div><div class="field"><label>Theme</label>${H.select('t', [{ v: 'system', l: 'Match my device' }, { v: 'light', l: 'Light' }, { v: 'dark', l: 'Dark' }], Settings.get('theme'), 'id="obTheme"').replace('select sm', 'select')}</div></div><div class="banner info mt-16">${I('lock', 'sm')}<span>Your data stays in this browser — nothing is uploaded. Back up regularly from <b>Backup &amp; Restore</b>; clearing browser data would delete it.</span></div><label class="row small mt-12"><input type="checkbox" class="cb" id="obPersist" checked>Ask the browser to keep my data persistent</label>`, footer: `<button class="btn" data-guide>Read the guide</button><button class="btn primary" data-go>Get started</button>` });
    const finish = async (guide) => { Settings.set('name', $('#obName').value.trim(), true); Settings.set('currency', $('#obCur').value, true); Settings.set('theme', $('#obTheme').value, true); Settings.set('onboarded', true, true); if ($('#obPersist').checked && navigator.storage && navigator.storage.persist) { try { await navigator.storage.persist(); } catch (_) { } } m.close(true); App.theme(); App.sidebar(); App.topbar(); if (guide) Router.go('#/settings/guide'); else App.render(); };
    m.root.querySelector('[data-go]').onclick = () => finish(false); m.root.querySelector('[data-guide]').onclick = () => finish(true);
    $('#obName').addEventListener('keydown', e => { if (e.key === 'Enter') finish(false); });
  }
};

/* =============================================================================
   08. BOOT
   ============================================================================= */
window.addEventListener('error', e => { console.error(e.error || e.message); if (!window.__errShown) { window.__errShown = true; setTimeout(() => window.__errShown = false, 5000); try { Toast.show('Something went wrong: ' + (e.message || 'unknown error'), { error: true }); } catch (_) { } } });
window.addEventListener('unhandledrejection', e => console.error('Unhandled promise rejection', e.reason));
/* Bind domain-object methods so they can be passed as callbacks (e.g. list.map(Habits.dayRate)) */
[Tasks, Events, Contacts, Projects, Goals, Finance, Biz, Ideas, Habits, Journal, School, Recent, Records, Notify, Suggest, Exporter, Docs, Report, Shopping, Trackers, DayView, Notes, Money, Importer, JournalUI, GoalPlanner, Kanban, TaskUI, DayPlan].forEach(o => Object.keys(o).forEach(k => { if (typeof o[k] === 'function') o[k] = o[k].bind(o); }));
(async function boot() {
  Settings.load(); App.theme();
  try { await Store.init(); } catch (e) { console.error(e); }
  App.sidebar(); App.topbar(); bindGlobal(); RTE.init(); DnD.init();
  if (Store.mode !== 'indexeddb') setTimeout(() => Toast.show('IndexedDB is unavailable (private mode?). Data is saved to limited localStorage — export backups often.', { error: true, ms: 9000 }), 800);
  App.render(); Notify.start();
  if (!Settings.get('onboarded')) setTimeout(() => Onboarding.open(), 200);
  setInterval(() => { if (Router.cur && ['dashboard', 'myday'].includes(Router.cur.name) && !Modal.top() && !document.activeElement.closest('input,textarea,[contenteditable="true"]')) { const k = D.today() + D.nowTime().slice(0, 4); if (k !== App._minute) { App._minute = k; App.render(); } } }, 60000);
})();
</script>
