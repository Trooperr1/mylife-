      if (spec.area !== false && spec.series.length === 1) out += `<path d="${d} L${pts[pts.length - 1][0]} ${a.y(Math.max(0, a.min))} L${pts[0][0]} ${a.y(Math.max(0, a.min))} Z" fill="${col}" opacity=".10"/>`;
      out += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
      pts.forEach((p, i) => { out += `<circle cx="${p[0]}" cy="${p[1]}" r="${pts.length > 40 ? 0 : 3}" fill="var(--surface)" stroke="${col}" stroke-width="2"><title>${U.esc(spec.labels[i])} · ${U.esc(s.name)}: ${U.esc(tip(s.values[i] || 0))}</title></circle>`; });
    });
    return `<svg class="chart" width="${w}" height="${a.h}" viewBox="0 0 ${w} ${a.h}">${a.g}${out}</svg>${this.legend(spec.series)}`;
  },
  donut(spec) {
    const segs = spec.segments.filter(s => s.value > 0); const total = U.sum(segs, s => s.value); const size = spec.size || 150, r = size / 2 - 12, c = 2 * Math.PI * r;
    if (!total) return '<div class="empty">No data yet</div>';
    let off = 0; const arcs = segs.map((s, i) => { const len = c * s.value / total; const el = `<circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" stroke="${s.color || this.COLORS[i % 10]}" stroke-width="18" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size / 2} ${size / 2})"><title>${U.esc(s.label)}: ${U.esc((spec.fmt || String)(s.value))} (${Math.round(s.value / total * 100)}%)</title></circle>`; off += len; return el; }).join('');
    const legend = segs.map((s, i) => `<div class="hbar" style="margin:4px 0"><i class="cdot" style="background:${s.color || this.COLORS[i % 10]}"></i><span class="grow ellipsis">${U.esc(s.label)}</span><span class="num faint">${Math.round(s.value / total * 100)}%</span><b class="num" style="min-width:70px;text-align:right">${U.esc((spec.fmt || String)(s.value))}</b></div>`).join('');
    return `<div class="row top wrap" style="gap:20px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none">${arcs}<text x="50%" y="48%" text-anchor="middle" style="font-size:15px;font-weight:600;fill:var(--text)">${U.esc(spec.center || '')}</text><text x="50%" y="62%" text-anchor="middle" style="font-size:10.5px;fill:var(--text-3)">${U.esc(spec.centerSub || '')}</text></svg><div class="grow" style="min-width:180px">${legend}</div></div>`;
  },
  ring(pct, size = 64, sw = 7, color = 'var(--accent)') { const r = (size - sw) / 2, c = 2 * Math.PI * r, p = U.clamp(pct || 0, 0, 100); return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" stroke="var(--surface-3)" stroke-width="${sw}"/><circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c * p / 100} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dasharray .6s"/></svg><b style="font-size:${size > 80 ? 18 : 13}px">${Math.round(p)}%</b></div>`; },
  hbars(items, fmt = v => v) { const max = Math.max(1, ...items.map(i => i.max ?? i.value)); return items.map((it, i) => `<div class="hbar"><span class="lbl" title="${U.attr(it.label)}">${U.esc(it.label)}</span><span class="bar"><span style="width:${U.clamp((it.value / (it.max ?? max)) * 100, 0, 100)}%;background:${it.color || (it.over ? 'var(--danger)' : this.COLORS[i % 10])}"></span></span><span class="v">${U.esc(it.display ?? fmt(it.value))}</span></div>`).join(''); },
  progress(pct, cls = '') { return `<div class="progress ${cls}"><span style="width:${U.clamp(pct || 0, 0, 100)}%"></span></div>`; }
};

/* =============================================================================
   05. DOMAIN LOGIC
   ============================================================================= */
const Recur = {
  /* Next occurrence date (YYYY-MM-DD) after `date` for a repeat rule */
  next(date, rule) {
    switch (rule) {
      case 'daily': return D.add(date, 1);
      case 'weekdays': { let d = D.add(date, 1); while ([0, 6].includes(D.dow(d))) d = D.add(d, 1); return d; }
      case 'weekly': return D.add(date, 7);
      case 'biweekly': return D.add(date, 14);
      case 'monthly': return D.addMonths(date, 1);
      case 'quarterly': return D.addMonths(date, 3);
      case 'yearly': return D.addYears(date, 1);
      default: return null;
    }
  },
  /* All occurrence start dates of a repeating item within [from, to] */
  between(start, rule, from, to, until) {
    if (!start) return [];
    if (!rule) return (start >= from && start <= to) ? [start] : [];
    const out = []; let d = start; let guard = 0;
    if (['daily', 'weekdays'].includes(rule) && d < from) { d = D.add(from, -1) > start ? D.add(from, -1) : start; if (rule === 'weekdays' && [0, 6].includes(D.dow(d)) && d !== start) d = Recur.next(d, rule); }
    if (['weekly', 'biweekly'].includes(rule) && d < from) { const step = rule === 'weekly' ? 7 : 14; const k = Math.floor(D.diff(start, from) / step); if (k > 0) d = D.add(start, k * step); }
    while (d <= to && guard++ < 1500) { if (until && d > until) break; if (d >= from) out.push(d); d = Recur.next(d, rule); if (!d) break; }
    return out;
  }
};

const Tasks = {
  active: () => Store.all('tasks').filter(t => !t.archived),
  isDone: t => t.status === 'done',
  isOverdue: t => !Tasks.isDone(t) && t.due && (t.due < D.today() || (t.due === D.today() && t.dueTime && t.dueTime < D.nowTime())),
  dueOn: d => Tasks.active().filter(t => t.due === d),
  forToday() { const td = D.today(); return Tasks.active().filter(t => (t.due === td) || (!this.isDone(t) && t.due && t.due < td) || (t.focus && t.focusDate === td) || (this.isDone(t) && t.doneAt && D.key(new Date(t.doneAt)) === td && (!t.due || t.due <= td))); },
  sort(list, by = 'smart') {
    const cmp = {
      smart: (a, b) => (this.isDone(a) - this.isDone(b)) || ((b.focus ? 1 : 0) - (a.focus ? 1 : 0)) || ((a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : 0) || (PRIO_RANK[a.priority] ?? 2) - (PRIO_RANK[b.priority] ?? 2) || (a.dueTime || '99') .localeCompare(b.dueTime || '99') || (a.order ?? 0) - (b.order ?? 0),
      due: (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (a.dueTime || '99').localeCompare(b.dueTime || '99'),
      priority: (a, b) => (PRIO_RANK[a.priority] ?? 2) - (PRIO_RANK[b.priority] ?? 2),
      created: (a, b) => b.createdAt - a.createdAt,
      title: (a, b) => (a.title || '').localeCompare(b.title || ''),
      manual: (a, b) => (a.order ?? a.createdAt) - (b.order ?? b.createdAt)
    }[by] || (() => 0);
    return [...list].sort(cmp);
  },
  progress(list) { const n = list.length; const d = list.filter(t => this.isDone(t)).length; return { n, d, pct: U.pct(d, n) }; },
  subProgress(t) { const s = t.subtasks || []; return s.length ? { n: s.length, d: s.filter(x => x.done).length } : null; },
  /* Toggle completion. Recurring tasks spawn the next occurrence automatically. */
  toggle(id) {
    const t = Store.get('tasks', id); if (!t) return;
    if (this.isDone(t)) { Store.update('tasks', id, { status: 'todo', doneAt: null }); return; }
    Store.update('tasks', id, { status: 'done', doneAt: Date.now() });
    if (t.repeat && !t.spawnedNext) {
      const base = t.due || D.today(); let next = Recur.next(base, t.repeat); while (next && next < D.today() && t.repeat === 'daily') next = Recur.next(next, t.repeat);
      const copy = { ...U.clone(t), id: undefined, status: 'todo', doneAt: null, due: next, spawnedNext: false, subtasks: (t.subtasks || []).map(s => ({ ...s, done: false })), reminder: t.reminder && next ? next + t.reminder.slice(10) : t.reminder, focus: false };
      delete copy.id; delete copy.createdAt; Store.add('tasks', copy); Store.update('tasks', id, { spawnedNext: true }, { silent: true });
      Toast.show(`Next “${U.trunc(t.title, 30)}” scheduled for ${D.smart(next)}`);
    }
    if (t.projectId) Projects.log(t.projectId, `Completed task “${t.title}”`);
  },
  postpone(id, days = 1) { const t = Store.get('tasks', id); if (!t) return; const base = t.due && t.due >= D.today() ? t.due : D.today(); Store.update('tasks', id, { due: D.add(base, days) }); Toast.show(`Moved to ${D.smart(D.add(base, days))}`); },
  duplicate(id) { const t = Store.get('tasks', id); if (!t) return; const c = U.clone(t); delete c.id; delete c.createdAt; c.title += ' (copy)'; c.status = 'todo'; c.doneAt = null; c.spawnedNext = false; Store.add('tasks', c); Toast.show('Task duplicated'); },
  quick(title, extra = {}) { return Store.add('tasks', { title, status: 'todo', priority: Settings.get('defaultPriority'), subtasks: [], tags: [], ...extra }); }
};

const Events = {
  /* Expand events (incl. recurring and multi-day) into occurrences within [from,to] */
  occurrences(from, to, filter) {
    const out = [];
    Store.all('events').forEach(e => {
      if (filter && !filter(e)) return;
      const span = e.endDate && e.endDate > e.date ? D.diff(e.date, e.endDate) : 0;
      const starts = Recur.between(e.date, e.repeat, span ? D.add(from, -span) : from, to, e.repeatUntil);
      starts.forEach(s => { for (let i = 0; i <= span; i++) { const d = D.add(s, i); if (d >= from && d <= to) out.push({ ...e, occ: d, occStart: s, multi: span > 0, dayIndex: i }); } });
    });
    return out.sort((a, b) => a.occ.localeCompare(b.occ) || ((a.allDay || !a.start) ? -1 : 0) - ((b.allDay || !b.start) ? -1 : 0) || (a.start || '').localeCompare(b.start || ''));
  },
  color: e => EV_COLOR[e.category] || U.colorFor(e.category),
  /* Calendar feed: events + tasks + birthdays + bills + school + project deadlines + trips + contact dates */
  feed(from, to, layers = {}) {
    const items = [];
    const on = k => layers[k] !== false;
    if (on('events')) this.occurrences(from, to).forEach(e => items.push({ kind: 'event', id: e.id, date: e.occ, title: e.title, time: e.allDay ? '' : e.start, end: e.end, color: this.color(e), cat: e.category, ref: e }));
    if (on('tasks')) Tasks.active().filter(t => t.due && t.due >= from && t.due <= to).forEach(t => items.push({ kind: 'task', id: t.id, date: t.due, title: t.title, time: t.dueTime, color: 'var(--text-3)', done: Tasks.isDone(t), ref: t }));
    if (on('birthdays')) Store.all('contacts').forEach(c => { if (c.birthday) Contacts.yearly(c.birthday, from, to).forEach(d => items.push({ kind: 'birthday', id: c.id, date: d, title: `🎂 ${c.name}'s birthday`, color: EV_COLOR.birthday, ref: c })); (c.importantDates || []).forEach(x => x.date && Contacts.yearly(x.date, from, to).forEach(d => items.push({ kind: 'contactdate', id: c.id, date: d, title: `${x.text} — ${c.name}`, color: EV_COLOR.anniversary, ref: c }))); if (c.nextFollowUp && c.nextFollowUp >= from && c.nextFollowUp <= to) items.push({ kind: 'followup', id: c.id, date: c.nextFollowUp, title: `Follow up: ${c.name}`, color: '#14b8a6', ref: c }); });
    if (on('payments')) Store.all('bills').filter(b => b.active !== false).forEach(b => Recur.between(b.nextDue, { weekly: 'weekly', monthly: 'monthly', quarterly: 'quarterly', yearly: 'yearly' }[b.frequency] || '', from, to).forEach(d => items.push({ kind: 'bill', id: b.id, date: d, title: `💳 ${b.name} · ${Money.fmt(b.amount, b.currency, 0)}`, color: EV_COLOR.payment, ref: b })));
    if (on('school')) Store.all('schoolItems').filter(s => s.due && s.due >= from && s.due <= to).forEach(s => items.push({ kind: 'school', id: s.id, date: s.due, title: `${s.type === 'exam' ? '📝 ' : ''}${s.title}`, time: s.dueTime, color: s.type === 'exam' ? EV_COLOR.exam : EV_COLOR.school, done: s.status === 'done', ref: s }));
    if (on('projects')) Store.all('projects').filter(p => !p.archived).forEach(p => { if (p.deadline && p.deadline >= from && p.deadline <= to) items.push({ kind: 'project', id: p.id, date: p.deadline, title: `⏱ ${p.title} deadline`, color: EV_COLOR.deadline, ref: p }); (p.milestones || []).forEach(m => { if (m.date && m.date >= from && m.date <= to) items.push({ kind: 'milestone', id: p.id, date: m.date, title: `◆ ${m.text}`, color: '#8b5cf6', done: m.done, ref: p }); }); });
    if (on('goals')) Store.all('goals').forEach(g => { if (g.targetDate && g.targetDate >= from && g.targetDate <= to) items.push({ kind: 'goal', id: g.id, date: g.targetDate, title: `🎯 ${g.title}`, color: g.color || '#f59e0b', ref: g }); });
    if (on('trips')) Store.all('trips').forEach(t => { if (t.start) D.range(t.start > from ? t.start : from, (t.end || t.start) < to ? (t.end || t.start) : to).forEach(d => items.push({ kind: 'trip', id: t.id, date: d, title: `✈ ${t.destination}`, color: EV_COLOR.travel, ref: t })); });
    if (on('reminders')) Store.all('reminders').filter(r => !r.done).forEach(r => Recur.between(r.date, r.repeat, from, to).forEach(d => items.push({ kind: 'reminder', id: r.id, date: d, title: `🔔 ${r.title}`, time: r.time, color: '#f97316', ref: r })));
    return items.sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''));
  },
  open(item) {
    const map = { event: () => Form.open('events', item.ref), task: () => Form.open('tasks', item.ref), birthday: () => Contacts.view(item.id), contactdate: () => Contacts.view(item.id), followup: () => Contacts.view(item.id), bill: () => Form.open('bills', item.ref), school: () => Form.open('schoolItems', item.ref), project: () => Router.go('#/projects/' + item.id), milestone: () => Router.go('#/projects/' + item.id), goal: () => Router.go('#/goals/' + item.id), trip: () => Router.go('#/travel/' + item.id), reminder: () => Form.open('reminders', item.ref) };
    (map[item.kind] || (() => { }))();
  },
  importantUpcoming(days = 365) {
    const td = D.today(), to = D.add(td, days); const list = [];
    this.occurrences(td, to, e => e.important || ['birthday', 'anniversary', 'exam', 'deadline'].includes(e.category)).forEach(e => { if (!list.some(x => x.id === e.id)) list.push({ title: e.title, date: e.occ, color: this.color(e), kind: 'event', ref: e, id: e.id }); });
    Store.all('contacts').forEach(c => (c.importantDates || []).forEach(x => { const d = x.date && Contacts.nextYearly(x.date); if (d && d <= to) list.push({ title: `${x.text} — ${c.name}`, date: d, color: EV_COLOR.anniversary, kind: 'contactdate', id: c.id, ref: c }); }));
    Store.all('goals').filter(g => g.targetDate && g.targetDate >= td && g.targetDate <= to && !['achieved', 'abandoned'].includes(g.status) && ['today', 'week', 'month', '3m', '6m', '1y'].includes(g.horizon)).forEach(g => list.push({ title: `🎯 ${g.title}`, date: g.targetDate, color: g.color || '#f59e0b', kind: 'goal', id: g.id, ref: g }));
    Store.all('trips').filter(t => t.start && t.start >= td && t.start <= to).forEach(t => list.push({ title: `✈ ${t.destination}`, date: t.start, color: EV_COLOR.travel, kind: 'trip', id: t.id, ref: t }));
    return list.sort((a, b) => a.date.localeCompare(b.date));
  }
};

const Contacts = {
  nextYearly(date, from = D.today()) { if (!date) return null; const md = date.slice(5); let y = +from.slice(0, 4); let d = `${y}-${md}`; if (md === '02-29' && D.dim(y, 1) < 29) d = `${y}-02-28`; if (d < from) { y++; d = `${y}-${md}`; if (md === '02-29' && D.dim(y, 1) < 29) d = `${y}-02-28`; } return d; },
  yearly(date, from, to) { const out = []; for (let y = +from.slice(0, 4); y <= +to.slice(0, 4); y++) { const d = `${y}-${date.slice(5)}`; if (d >= from && d <= to && d >= date) out.push(d); } return out; },
  age(birthday, on) { if (!birthday) return null; const b = D.parse(birthday), o = D.parse(on || D.today()); let a = o.getFullYear() - b.getFullYear(); if (o.getMonth() < b.getMonth() || (o.getMonth() === b.getMonth() && o.getDate() < b.getDate())) a--; return a; },
  birthdays(days = 60) { const td = D.today(); return Store.all('contacts').filter(c => c.birthday).map(c => ({ c, date: this.nextYearly(c.birthday) })).filter(x => D.diff(td, x.date) <= days).sort((a, b) => a.date.localeCompare(b.date)); },
  followUps() { const td = D.today(); return Store.all('contacts').filter(c => c.nextFollowUp && c.nextFollowUp <= D.add(td, 7)).sort((a, b) => a.nextFollowUp.localeCompare(b.nextFollowUp)); },
  view(id) {
    const c = Store.get('contacts', id); if (!c) return; Recent.add('contacts', id);
    const links = [...(c.businessIds || []).map(b => Store.get('businesses', b)).filter(Boolean).map(b => `<a href="#/business/${b.id}" data-close class="badge accent">${I('briefcase', 'sm')}${U.esc(b.name)}</a>`), ...(c.projectIds || []).map(p => Store.get('projects', p)).filter(Boolean).map(p => `<a href="#/projects/${p.id}" data-close class="badge">${I('projects', 'sm')}${U.esc(p.title)}</a>`)].join(' ');
    const evs = Store.all('events').filter(e => e.contactId === id);
    const m = Modal.open({
      title: U.esc(c.name), body: `<div class="row mb-16"><div class="biz-logo" style="background:${U.colorFor(c.name)};border-radius:50%">${U.esc(U.initials(c.name))}</div><div><b>${U.esc(c.jobTitle || '')}${c.jobTitle && c.company ? ' · ' : ''}${U.esc(c.company || '')}</b><div class="small muted">${U.esc(c.category || '')}${c.relationship ? ' · ' + U.esc(c.relationship) : ''}</div></div></div>
      <dl class="kv">${c.phone ? `<dt>Phone</dt><dd><a href="tel:${U.attr(c.phone)}">${U.esc(c.phone)}</a></dd>` : ''}${c.email ? `<dt>Email</dt><dd><a href="mailto:${U.attr(c.email)}">${U.esc(c.email)}</a></dd>` : ''}${c.birthday ? `<dt>Birthday</dt><dd>${D.fmt(c.birthday)} (turns ${Contacts.age(c.birthday, Contacts.nextYearly(c.birthday))} on ${D.smart(Contacts.nextYearly(c.birthday))})</dd>` : ''}${(c.importantDates || []).map(x => `<dt>${U.esc(x.text)}</dt><dd>${D.fmt(x.date)}</dd>`).join('')}<dt>Last contact</dt><dd>${c.lastContact ? D.fmt(c.lastContact) + ' (' + D.rel(c.lastContact) + ')' : '—'}</dd><dt>Next follow-up</dt><dd class="${c.nextFollowUp && c.nextFollowUp < D.today() ? 'neg' : ''}">${c.nextFollowUp ? D.fmt(c.nextFollowUp) + ' (' + D.rel(c.nextFollowUp) + ')' : '—'}</dd>${(c.tags || []).length ? `<dt>Tags</dt><dd>${c.tags.map(t => `<span class="tag">${U.esc(t)}</span>`).join(' ')}</dd>` : ''}${links ? `<dt>Connected to</dt><dd>${links}</dd>` : ''}${evs.length ? `<dt>Events</dt><dd>${evs.map(e => U.esc(e.title) + ' · ' + D.fmt(e.date)).join('<br>')}</dd>` : ''}${c.notes ? `<dt>Notes</dt><dd>${U.esc(c.notes)}</dd>` : ''}</dl>`,
      footer: `<button class="btn" data-log>${I('check', 'sm')}Log contact today</button><button class="btn" data-fu>${I('calendar', 'sm')}Follow up in 2 weeks</button><button class="btn primary" data-edit>${I('edit', 'sm')}Edit</button>`
    });
    m.root.querySelector('[data-log]').onclick = () => { Store.update('contacts', id, { lastContact: D.today(), nextFollowUp: c.nextFollowUp && c.nextFollowUp <= D.today() ? '' : c.nextFollowUp }); m.close(true); Toast.show('Contact logged'); };
    m.root.querySelector('[data-fu]').onclick = () => { Store.update('contacts', id, { nextFollowUp: D.add(D.today(), 14) }); m.close(true); Toast.show('Follow-up scheduled'); };
    m.root.querySelector('[data-edit]').onclick = () => { m.close(true); Form.open('contacts', c); };
  }
};

const Projects = {
  tasks: id => Tasks.active().filter(t => t.projectId === id),
  progress(p) { const ts = this.tasks(p.id); const ms = p.milestones || []; const n = ts.length + ms.length; if (p.status === 'completed') return 100; if (!n) return 0; return U.pct(ts.filter(Tasks.isDone).length + ms.filter(m => m.done).length, n); },
  spent(p) { return Money.total(Store.all('bizTx').filter(x => x.projectId === p.id && x.kind === 'expense'), x => x.amount, x => x.currency).total + U.sum(Store.all('transactions').filter(x => x.projectId === p.id && x.kind === 'expense'), x => Money.toBase(x.amount, x.currency) || 0); },
  log(id, text) { const p = Store.get('projects', id); if (!p) return; const act = [{ ts: Date.now(), text }, ...(p.activity || [])].slice(0, 100); Store.update('projects', id, { activity: act }, { silent: true }); },
  fromGoal(g, title) { const p = Store.add('projects', { title: title || g.title, description: g.description || '', area: { Business: 'Business', Education: 'Education', Career: 'Career', 'Financial independence': 'Financial' }[g.category] || 'Personal', status: 'active', priority: g.priority || 'medium', start: D.today(), deadline: g.targetDate || '', goalId: g.id, milestones: [], currency: Settings.get('currency'), activity: [{ ts: Date.now(), text: 'Project created from goal “' + g.title + '”' }] }); return p; },
  fromIdea(i) { const p = Store.add('projects', { title: i.title, description: i.description || '', area: 'Business', status: 'planning', priority: i.priority || 'medium', start: D.today(), budget: i.investment || null, currency: i.currency || Settings.get('currency'), milestones: (i.nextSteps || []).map(s => ({ id: U.uid(), text: s.text, done: !!s.done })), notes: [i.problem && 'Problem: ' + i.problem, i.customers && 'Customers: ' + i.customers].filter(Boolean).join('\n\n'), ideaId: i.id, activity: [{ ts: Date.now(), text: 'Project created from business idea' }] }); return p; },
  /* Convert milestones into tasks (project → task conversion) */

const Goals = {
  progress(g) {
    if (g.status === 'achieved') return 100;
    if (g.progressMode === 'manual') return g.progress || 0;
    const parts = [];
    const ms = g.milestones || []; if (ms.length) parts.push(U.pct(ms.filter(m => m.done).length, ms.length));
    const ps = Store.all('projects').filter(p => p.goalId === g.id && !p.archived); ps.forEach(p => parts.push(Projects.progress(p)));
    const ts = Tasks.active().filter(t => t.goalId === g.id && !t.projectId); if (ts.length) parts.push(U.pct(ts.filter(Tasks.isDone).length, ts.length));

  active: () => Store.all('goals').filter(g => !g.archived && !['achieved', 'abandoned'].includes(g.status)),

const Finance = {
  KEYWORDS: [
    [/migros|coop|aldi|lidl|denner|spar|grocer|supermarket|restaurant|café|cafe|lunch|dinner|pizza|food|bakery|mcdonald|burger|kebab|essen/i, 'Food'],

    [/rent|miete|loyer|electricity|strom|nebenkosten|water bill|heating|household|ikea/i, 'Housing'],
    [/gym|fitness|sport|protein|yoga|basic-fit|crossfit/i, 'Fitness'],
    [/netflix|spotify|apple music|icloud|youtube premium|disney|subscription|abo|prime|chatgpt|adobe|microsoft 365/i, 'Subscriptions'],
    [/book|course|school|tuition|udemy|coursera|exam fee|university|stationery/i, 'Education'],
    [/pharmacy|apotheke|doctor|arzt|dentist|hospital|medic/i, 'Health'],
    [/insurance|versicherung|krankenkasse|assurance/i, 'Insurance'],
    [/tax|steuer|impôt/i, 'Taxes'],
    [/cinema|kino|concert|game|steam|playstation|bar |club|party/i, 'Entertainment'],
    [/zara|h&m|clothes|shoes|amazon|galaxus|digitec|shopping|zalando/i, 'Shopping'],
    [/hotel|airbnb|booking\.com|hostel|vacation|trip/i, 'Travel'],
    [/haircut|coiffeur|barber|cosmetic/i, 'Personal']
  ],
  INCOME_KW: [[/salary|lohn|gehalt|salaire|payroll|wage/i, 'Salary'], [/allowance|taschengeld|stipend/i, 'Allowance'], [/invoice|client|customer|business/i, 'Business income'], [/gift|geschenk/i, 'Gift']],
  guessCategory(desc, kind = 'expense') {
    if (!desc || desc.length < 3) return null;
    const past = Store.all('transactions').filter(t => t.kind === kind && t.description && t.description.toLowerCase() === desc.toLowerCase()).pop();
    if (past && past.category) return past.category;
    const kw = kind === 'income' ? this.INCOME_KW : this.KEYWORDS; const hit = kw.find(([re]) => re.test(desc)); return hit ? hit[1] : null;
  },
  inMonth: (list, mk) => list.filter(t => t.date && t.date.startsWith(mk)),
  month(mk = D.today().slice(0, 7)) {
    const tx = this.inMonth(Store.all('transactions'), mk);
    const inc = Money.total(tx.filter(t => t.kind === 'income')), exp = Money.total(tx.filter(t => t.kind === 'expense'));
    return { income: inc.total, expenses: exp.total, net: U.round2(inc.total - exp.total), skipped: inc.skipped + exp.skipped, tx };
  },
  byCategory(tx) { const m = {}; tx.filter(t => t.kind === 'expense').forEach(t => { const v = Money.toBase(t.amount, t.currency); if (v != null) m[t.category || 'Other'] = (m[t.category || 'Other'] || 0) + v; }); return Object.entries(m).map(([k, v]) => ({ label: k, value: U.round2(v) })).sort((a, b) => b.value - a.value); },
  lastMonths(n = 12, end = D.today()) { const out = []; let mk = D.monthStart(end); for (let i = n - 1; i >= 0; i--) out.push(D.addMonths(mk, -i).slice(0, 7)); return out; },
  budgetStatus(mk = D.today().slice(0, 7)) { const cat = Object.fromEntries(this.byCategory(this.month(mk).tx).map(x => [x.label, x.value])); return Store.all('budgets').map(b => ({ ...b, spent: U.round2(cat[b.category] || 0), pct: U.pct(cat[b.category] || 0, b.amount) })); },
  upcomingBills(days = 30) { const td = D.today(), to = D.add(td, days); const out = []; Store.all('bills').filter(b => b.active !== false && b.nextDue).forEach(b => { if (b.nextDue <= to) out.push({ ...b, overdue: b.nextDue < td }); }); return out.sort((a, b) => a.nextDue.localeCompare(b.nextDue)); },
  payBill(id) {
    const b = Store.get('bills', id); if (!b) return;
    Store.add('transactions', { kind: 'expense', amount: b.amount, currency: b.currency, date: D.today(), category: b.category, description: b.name, note: 'Recurring payment', billId: b.id, tags: [] });
    const next = b.frequency === 'once' ? null : Recur.next(b.nextDue, { weekly: 'weekly', monthly: 'monthly', quarterly: 'quarterly', yearly: 'yearly' }[b.frequency]);
    Store.update('bills', id, next ? { nextDue: next, lastPaid: D.today() } : { active: false, lastPaid: D.today() });
    Toast.show(`Paid ${b.name} — recorded as expense${next ? ', next due ' + D.smart(next) : ''}`);
  },
  /* Simple projection: average net of the last 3 complete months */
  projection(months = 6) { const ms = this.lastMonths(4).slice(0, 3); const nets = ms.map(m => this.month(m).net); const hasData = ms.some(m => this.month(m).tx.length); const avg = U.round2(U.avg(nets)); return { avg, hasData, months: [...Array(months)].map((_, i) => ({ m: D.addMonths(D.monthStart(D.today()), i + 1).slice(0, 7), v: U.round2(avg * (i + 1)) })) }; }
};

const Biz = {
  tx: id => Store.all('bizTx').filter(x => x.businessId === id),
  sum(list, kind, filter = () => true) { const b = list[0] ? Store.get('businesses', list[0].businessId) : null; return U.round2(U.sum(list.filter(x => x.kind === kind && filter(x)), x => Biz.conv(x, b))); },
  /* Convert a business transaction to the business's own accounting currency (falls back to base rates) */
  conv(x, b) { const bc = (b && b.currency) || Settings.get('currency'); if (!x.currency || x.currency === bc) return Number(x.amount) || 0; const toBase = Money.toBase(x.amount, x.currency); if (toBase == null) return 0; const r = bc === Settings.get('currency') ? 1 : Number((Settings.get('rates') || {})[bc]); return r > 0 ? toBase / r : 0; },
  stats(id, mk) {
    const all = this.tx(id); const list = mk ? all.filter(x => x.date && x.date.startsWith(mk)) : all; const paid = x => x.status !== 'unpaid';
    const revenue = this.sum(list, 'revenue', paid), expenses = this.sum(list, 'expense', paid), invested = this.sum(list, 'investment', paid);
    const receivable = this.sum(all, 'revenue', x => x.status === 'unpaid'), payable = this.sum(all, 'expense', x => x.status === 'unpaid');
    const startup = this.sum(all, 'expense', x => x.category === 'Startup costs');
    const cash = U.round2(invested + revenue - expenses);
    const customers = new Set(all.filter(x => x.kind === 'revenue' && x.counterparty).map(x => x.counterparty.trim().toLowerCase())).size;
    return { revenue, expenses, profit: U.round2(revenue - expenses), invested, receivable, payable, cash, startup, customers, count: list.length };
  },
  monthly(id, n = 12) { return Finance.lastMonths(n).map(mk => ({ mk, ...this.stats(id, mk) })); },
  cur: id => (Store.get('businesses', id) || {}).currency || Settings.get('currency'),
  statusOpt: v => BIZ_STATUS.find(s => s.v === v) || BIZ_STATUS[0],
  fromIdea(i) { const b = Store.add('businesses', { name: i.title, description: i.description || '', industry: i.industry || '', status: 'planning', currency: i.currency || Settings.get('currency'), targetCustomers: i.customers || '', partners: [], team: [], plan: { marketResearch: i.research || '', competitors: i.competitors || '', risks: i.risks || '', opportunities: i.opportunities || '', strengths: i.advantages || '', weaknesses: i.disadvantages || '', targetMarket: i.customers || '', businessPlan: i.thoughts || '' }, ideaId: i.id }); return b; }
};

const Ideas = {
  KEYS: ['sDemand', 'sProfit', 'sEdge', 'sEase', 'sCapital', 'sFit', 'sScale', 'sRisk'],
  /* Evaluation score 0-100 = average of the rated criteria (unrated criteria are ignored) */
  score(i) { const vals = this.KEYS.map(k => Number(i[k])).filter(v => v >= 1); return vals.length ? Math.round(((U.avg(vals) - 1) / 4) * 100) : null; },
  rated: i => Ideas.KEYS.filter(k => Number(i[k]) >= 1).length,
  margin(i) { if (i.revenue == null && i.expenses == null) return null; return U.round2((i.revenue || 0) - (i.expenses || 0)); },
  payback(i) { const m = this.margin(i); return (m && m > 0 && i.investment) ? Math.ceil(i.investment / m) : null; }

const Habits = {
  active: () => Store.all('habits').filter(h => !h.archived),
  scheduled: (h, d) => !h.days || !h.days.length || h.days.includes(String(D.dow(d))),
  done: (h, d) => !!(h.log || {})[d],
  toggle(id, d) { const h = Store.get('habits', id); if (!h) return; const log = { ...(h.log || {}) }; if (log[d]) delete log[d]; else log[d] = true; Store.update('habits', id, { log }); },
  streak(h) { let d = D.today(); if (!this.done(h, d)) d = D.add(d, -1); let n = 0, g = 0; while (g++ < 2000) { if (this.scheduled(h, d)) { if (this.done(h, d)) n++; else break; } d = D.add(d, -1); if (h.createdAt && d < D.key(new Date(h.createdAt))) break; } return n; },
  best(h) { const keys = Object.keys(h.log || {}).sort(); if (!keys.length) return 0; let best = 0, cur = 0, d = keys[0]; const end = D.today(); let g = 0; while (d <= end && g++ < 4000) { if (this.scheduled(h, d)) { if (this.done(h, d)) { cur++; best = Math.max(best, cur); } else if (d !== end) cur = 0; } d = D.add(d, 1); } return best; },
  rate(h, days = 30) { const start = h.createdAt ? D.key(new Date(h.createdAt)) : D.add(D.today(), -days); let s = 0, d = 0; D.range(D.add(D.today(), -(days - 1)), D.today()).forEach(k => { if (k < start || !this.scheduled(h, k)) return; s++; if (this.done(h, k)) d++; }); return U.pct(d, s); },
  dayRate(d) { const hs = this.active().filter(h => this.scheduled(h, d) && (!h.createdAt || D.key(new Date(h.createdAt)) <= d)); return { n: hs.length, d: hs.filter(h => this.done(h, d)).length }; }
};

/* Generic record operations shared by every section (delete with undo, archive, favorite, open) */
const Records = {

    if (confirm && !(await Confirm(`Delete “${U.trunc(titleOf(c, it), 60)}”? You can undo right after.`, { ok: 'Delete', danger: true, title: 'Delete ' + (SCHEMA[c] ? SCHEMA[c].label.toLowerCase() : 'item') }))) return false;
    const removed = Store.remove(c, id);
    let file = null; if (c === 'documents') { try { file = await Store.getFile(id); } catch (_) { } Store.delFile(id).catch(() => { }); }

/* =============================================================================
   REMINDERS & NOTIFICATIONS ENGINE
   Runs every 30s while the app is open. Browser notifications require permission
   and only fire while this page is open (no server / service worker push).
   ============================================================================= */
const Notify = {
  timer: null,
  start() { this.check(); this.timer = setInterval(() => this.check(), 30000); document.addEventListener('visibilitychange', () => { if (!document.hidden) this.check(); }); },
  fired() { return Store.meta.fired || (Store.meta.fired = {}); },
  push(key, title, body, src, when = Date.now()) {
    const f = this.fired(); if (f[key]) return; f[key] = Date.now();
    Store.add('notifications', { title, body, ts: when, read: false, src }, { silent: true });
    if (Settings.get('notif').browser && 'Notification' in window && Notification.permission === 'granted') { try { new Notification(title, { body, tag: key }); } catch (_) { } }
    this.dirty = true;
  },
  /* Collect everything that is due now */
  check() {
    if (!Store.data.tasks) return;
    const now = new Date(), nowMs = now.getTime(), td = D.today(), nt = D.nowTime(); const n = Settings.get('notif'); this.dirty = false;
    Store.all('reminders').forEach(r => {
      if (r.done || !r.date || !r.time) return;
      const at = r.snoozedUntil && r.snoozedUntil > 0 ? r.snoozedUntil : D.dt(r.date, r.time).getTime();
      if (at <= nowMs) this.push(`rem:${r.id}:${r.date}:${r.snoozedUntil || 0}`, '🔔 ' + r.title, labelOf(REMINDER_TYPES, r.type) + (r.note ? ' · ' + r.note : ''), { c: 'reminders', id: r.id });
    });
    Tasks.active().forEach(t => { if (!Tasks.isDone(t) && t.reminder) { const at = t.snoozedUntil || new Date(t.reminder).getTime(); if (at && at <= nowMs) this.push(`task:${t.id}:${t.reminder}:${t.snoozedUntil || 0}`, '✓ Task reminder: ' + t.title, t.due ? 'Due ' + D.smart(t.due) + (t.dueTime ? ' at ' + D.time(t.dueTime) : '') : '', { c: 'tasks', id: t.id }); } });
    Events.occurrences(D.add(td, -1), D.add(td, 8)).forEach(e => {
      if (e.reminder === '' || e.reminder == null) return;
      const start = D.dt(e.occStart, e.allDay ? '09:00' : (e.start || '09:00')).getTime(); const at = start - Number(e.reminder) * 60000;
      if (at <= nowMs && start + 3600000 > nowMs && e.dayIndex === 0) this.push(`ev:${e.id}:${e.occStart}`, '📅 ' + e.title, (e.allDay ? 'All day' : D.time(e.start)) + ' · ' + D.smart(e.occStart) + (e.location ? ' · ' + e.location : ''), { c: 'events', id: e.id });
    });
    Habits.active().forEach(h => { if (h.reminderTime && Habits.scheduled(h, td) && !Habits.done(h, td) && h.reminderTime <= nt) this.push(`hab:${h.id}:${td}`, '🔁 Habit: ' + h.name, h.target || 'Keep your streak going', { c: 'habits', id: h.id }); });
    if (n.dailyDigest && nt >= (n.digestTime || '08:00')) {
      const todays = Tasks.active().filter(t => !Tasks.isDone(t) && t.due === td).length; const over = Tasks.active().filter(Tasks.isOverdue).length; const evs = Events.occurrences(td, td).length;
      this.push(`digest:${td}`, '☀️ Your day at a glance', `${U.plural(todays, 'task')} due today, ${U.plural(evs, 'event')}${over ? `, ${over} overdue` : ''}.`, { route: '#/myday' });
    }
    const lead = n.leadDays ?? 3;
    Finance.upcomingBills(lead).forEach(b => this.push(`bill:${b.id}:${b.nextDue}`, '💳 Payment due: ' + b.name, Money.fmt(b.amount, b.currency) + ' · ' + (b.overdue ? 'overdue since ' : 'due ') + D.smart(b.nextDue), { c: 'bills', id: b.id }));
    School.upcoming(lead).forEach(s => this.push(`school:${s.id}:${s.due}`, (s.type === 'exam' ? '📝 Exam: ' : '📚 School: ') + s.title, 'Due ' + D.smart(s.due), { route: '#/school' }));
    Store.all('projects').filter(p => !p.archived && p.status !== 'completed').forEach(p => { (p.milestones || []).filter(m => !m.done && m.date && D.diff(td, m.date) <= lead && D.diff(td, m.date) >= -1).forEach(m => this.push(`ms:${p.id}:${m.id}:${m.date}`, '◆ Milestone: ' + m.text, p.title + ' · ' + D.smart(m.date), { route: '#/projects/' + p.id })); if (p.deadline && D.diff(td, p.deadline) <= lead && D.diff(td, p.deadline) >= -1) this.push(`pd:${p.id}:${p.deadline}`, '⏱ Project deadline: ' + p.title, D.smart(p.deadline), { route: '#/projects/' + p.id }); });
    Store.all('bizTx').filter(x => x.status === 'unpaid' && x.dueDate && D.diff(td, x.dueDate) <= lead).forEach(x => { const b = Store.get('businesses', x.businessId); this.push(`inv:${x.id}:${x.dueDate}`, (x.kind === 'revenue' ? '📨 Invoice due: ' : '📤 Supplier payment due: ') + (x.counterparty || x.description || ''), (b ? b.name + ' · ' : '') + Money.fmt(x.amount, x.currency || Biz.cur(x.businessId)) + ' · ' + D.smart(x.dueDate), { route: '#/business/' + x.businessId }); });
    Contacts.followUps().filter(c => c.nextFollowUp <= td).forEach(c => this.push(`fu:${c.id}:${c.nextFollowUp}`, '👋 Follow up with ' + c.name, 'Planned for ' + D.smart(c.nextFollowUp), { c: 'contacts', id: c.id }));
    Contacts.birthdays(1).forEach(x => this.push(`bd:${x.c.id}:${x.date}`, '🎂 Birthday: ' + x.c.name, D.smart(x.date) + (x.c.birthday ? ` · turns ${Contacts.age(x.c.birthday, x.date)}` : ''), { c: 'contacts', id: x.c.id }));
    Store.all('documents').filter(d => d.expiry && D.diff(td, d.expiry) <= 30 && D.diff(td, d.expiry) >= -1).forEach(d => this.push(`doc:${d.id}:${d.expiry}`, '📄 Document expires: ' + d.name, D.smart(d.expiry), { c: 'documents', id: d.id }));
    const last = Settings.get('lastBackup'); const days = Settings.get('backupDays');
    if (days && Store.all('tasks').length + Store.all('notes').length + Store.all('journal').length > 0 && (!last || D.diff(D.key(new Date(last)), td) >= days)) this.push(`backup:${td}`, '💾 Time for a backup', 'Export your data so it is safe if browser storage is cleared.', { route: '#/backup' });
    if (this.dirty) { Store.save(); App.badges(); if (Router.cur && Router.cur.name === 'notifications') App.render(); }
  },
  unread: () => Store.all('notifications').filter(n => !n.read).length,
  snooze(nid, mins) {
    const n = Store.get('notifications', nid); if (!n) return; const until = Date.now() + mins * 60000;
    if (n.src && n.src.c === 'reminders') Store.update('reminders', n.src.id, { snoozedUntil: until });
    else if (n.src && n.src.c === 'tasks') Store.update('tasks', n.src.id, { snoozedUntil: until });
    else Store.add('reminders', { title: n.title.replace(/^\S+\s/, ''), date: D.key(new Date(until)), time: D.key(new Date(until)) && D.pad(new Date(until).getHours()) + ':' + D.pad(new Date(until).getMinutes()), type: 'general', note: n.body });
    Store.update('notifications', nid, { read: true, snoozed: until }); Toast.show(`Snoozed for ${mins >= 60 ? mins / 60 + 'h' : mins + ' min'}`);
  },
  complete(nid) {
    const n = Store.get('notifications', nid); if (!n) return;
    if (n.src && n.src.c === 'reminders') { const r = Store.get('reminders', n.src.id); if (r) { if (r.repeat) { Store.update('reminders', r.id, { date: Recur.next(r.date, r.repeat), snoozedUntil: 0 }); } else Store.update('reminders', r.id, { done: true }); } }
    if (n.src && n.src.c === 'tasks') { const t = Store.get('tasks', n.src.id); if (t && !Tasks.isDone(t)) Tasks.toggle(t.id); }
    if (n.src && n.src.c === 'habits') { const h = Store.get('habits', n.src.id); if (h && !Habits.done(h, D.today())) Habits.toggle(h.id, D.today()); }
    if (n.src && n.src.c === 'bills') Finance.payBill(n.src.id);

  async requestPermission() {

};

/* =============================================================================
   PLANNING SUGGESTIONS (rule-based local logic — no AI service involved)
   ============================================================================= */
const Suggest = {
  daily() {
    const td = D.today(); const out = []; const all = Tasks.active(); const open = all.filter(t => !Tasks.isDone(t));
    const over = open.filter(Tasks.isOverdue); const today = open.filter(t => t.due === td); const urgent = open.filter(t => ['urgent', 'high'].includes(t.priority) && (!t.due || t.due <= D.add(td, 3)));
    if (over.length) out.push(['alert', `You have ${U.plural(over.length, 'overdue task')}. Reschedule or finish “${U.trunc(Tasks.sort(over)[0].title, 40)}” first.`, '#/tasks?v=overdue']);
    if (!all.some(t => t.focus && t.focusDate === td) && (today.length || urgent.length)) out.push(['star', `Pick up to 3 priorities for today — start with “${U.trunc(Tasks.sort(urgent.length ? urgent : today)[0].title, 40)}”.`, '#/myday']);
    if (today.length > 8) out.push(['info', `${today.length} tasks are due today — consider postponing low-priority ones.`, '#/tasks?v=today']);
    const evs = Events.occurrences(td, td).filter(e => !e.allDay && e.start); if (evs.length) out.push(['calendar', `${U.plural(evs.length, 'appointment')} today — first at ${D.time(evs[0].start)}: ${U.trunc(evs[0].title, 36)}.`, '#/calendar?v=day']);
    const ex = School.upcoming(7).filter(s => s.type === 'exam'); if (ex.length) out.push(['school', `Exam “${U.trunc(ex[0].title, 32)}” ${D.rel(ex[0].due)} — schedule a revision session.`, '#/school']);
    const bills = Finance.upcomingBills(3); if (bills.length) out.push(['wallet', `${U.plural(bills.length, 'payment')} due within 3 days (${U.esc(bills[0].name)}).`, '#/finance']);
    const hs = Habits.dayRate(td); if (hs.n && hs.d < hs.n) out.push(['repeat', `${hs.n - hs.d} of ${hs.n} habits still open today.`, '#/habits']);
    const fus = Contacts.followUps().filter(c => c.nextFollowUp <= td); if (fus.length) out.push(['users', `Follow up with ${fus.slice(0, 2).map(c => c.name).join(' and ')}${fus.length > 2 ? ' and others' : ''}.`, '#/contacts']);
    const stale = Goals.active().filter(g => !Tasks.active().some(t => t.goalId === g.id && !Tasks.isDone(t)) && !Store.all('projects').some(p => p.goalId === g.id && p.status === 'active')); if (stale.length) out.push(['target', `Goal “${U.trunc(stale[0].title, 36)}” has no open tasks or active projects. Add a next action.`, '#/goals/' + stale[0].id]);
    if (!Store.all('journal').some(j => j.date === td) && new Date().getHours() >= 18) out.push(['journal', 'Take 5 minutes to write today’s journal entry.', '#/journal/new']);
    if (!out.length) out.push(['check', all.length ? 'Nothing urgent — a good moment to work on a long-term goal.' : 'Start by adding a few tasks for today with the + button.', all.length ? '#/future' : '#/tasks']);
    return out;
  },
  weekly() {
    const td = D.today(), ws = D.weekStart(td), we = D.add(ws, 6), nws = D.add(ws, 7), nwe = D.add(ws, 13); const out = []; const open = Tasks.active().filter(t => !Tasks.isDone(t));
    const thisWeek = open.filter(t => t.due && t.due <= we); const nextWeek = open.filter(t => t.due && t.due >= nws && t.due <= nwe); const undated = open.filter(t => !t.due);
    const load = D.range(td, we).map(d => ({ d, n: open.filter(t => t.due === d).length + Events.occurrences(d, d).length }));
    const light = U.sortBy(load, x => x.n)[0];
    if (thisWeek.length) out.push(['tasks', `${U.plural(thisWeek.length, 'open task')} due this week. Lightest remaining day: ${D.fmt(light.d, 'wdl')} (${light.n} items).`, '#/tasks?v=upcoming']);
    if (undated.length) out.push(['calendar', `${U.plural(undated.length, 'task has', 'tasks have')} no due date — schedule the important ones.`, '#/tasks?v=all']);
    if (nextWeek.length) out.push(['arrow', `${U.plural(nextWeek.length, 'task')} already planned for next week.`, '#/tasks?v=upcoming']);
    Store.all('projects').filter(p => p.status === 'active' && p.deadline && D.diff(td, p.deadline) <= 14 && Projects.progress(p) < 70).forEach(p => out.push(['projects', `“${U.trunc(p.title, 30)}” is ${Projects.progress(p)}% done with the deadline ${D.rel(p.deadline)}.`, '#/projects/' + p.id]));
    Store.all('businesses').filter(b => b.status === 'active').forEach(b => { const s = Biz.stats(b.id); if (s.receivable > 0) out.push(['receipt', `${b.name}: ${Money.fmt(s.receivable, b.currency)} in unpaid customer invoices.`, '#/business/' + b.id]); });
    if (!out.length) out.push(['check', 'Your week looks clear. Review your goals and plan your next steps.', '#/future']);
    return out;
  }
};

const Search = {
  run(q, limit = 6) {
    q = q.trim().toLowerCase(); if (!q) return [];
    const words = q.split(/\s+/); const groups = [];
    SEARCH_SRC.forEach(([c, label, icon, hay, sub]) => {
      const hits = [];
      for (const it of Store.all(c)) { const h = hay(it); if (!h) continue; const s = h.filter(Boolean).join(' ').toLowerCase(); if (words.every(w => s.includes(w))) { const t = titleOf(c, it).toLowerCase(); hits.push({ it, score: (t.startsWith(q) ? 3 : t.includes(q) ? 2 : 1) + (it.archived ? -2 : 0) }); } }
      if (hits.length) groups.push({ c, label, icon, total: hits.length, items: hits.sort((a, b) => b.score - a.score || (b.it.updatedAt || 0) - (a.it.updatedAt || 0)).slice(0, limit).map(h => ({ c, id: h.it.id, title: titleOf(c, h.it), sub: sub(h.it), archived: h.it.archived })) });
    });
    return groups;
  },
  open() {
    const m = Modal.open({ cls: 'palette', body: `<div class="palette-in">${I('search')}<input id="palIn" placeholder="Search tasks, notes, journal, goals, projects, contacts… or type a command" autocomplete="off"><span class="kbd">Esc</span></div><div class="palette-res" id="palRes"></div>` });
    m.body.style.padding = '0'; const inp = $('#palIn', m.root), res = $('#palRes', m.root); let items = [], sel = 0;
    const draw = () => {
      const q = inp.value; let html = ''; items = [];
      if (!q.trim()) {
        const rec = Recent.list(6);
        if (rec.length) { html += `<div class="pr-group">Recently opened</div>`; rec.forEach(r => { items.push({ run: () => Records.open(r.c, r.id) }); html += `<div class="pr-item" data-i="${items.length - 1}">${I((SEARCH_SRC.find(s => s[0] === r.c) || [, , 'file'])[2], 'sm')}<span class="ellipsis">${U.esc(titleOf(r.c, r.item))}</span><span class="pr-sub">${U.esc((SEARCH_SRC.find(s => s[0] === r.c) || [, ''])[1])}</span></div>`; }); }
        html += `<div class="pr-group">Go to</div>`; NAV_FLAT.forEach(([k, l, ic]) => { items.push({ run: () => Router.go('#/' + k) }); html += `<div class="pr-item" data-i="${items.length - 1}">${I(ic, 'sm')}<span>${U.esc(T(l))}</span></div>`; });
      } else {
        const groups = this.run(q); const ql = q.toLowerCase();
        NAV_FLAT.filter(([k, l]) => l.toLowerCase().includes(ql) || T(l).toLowerCase().includes(ql)).forEach(([k, l, ic], i) => { if (!i) html += `<div class="pr-group">Go to</div>`; items.push({ run: () => Router.go('#/' + k) }); html += `<div class="pr-item" data-i="${items.length - 1}">${I(ic, 'sm')}<span>${U.hl(T(l), q)}</span></div>`; });
        groups.forEach(g => { html += `<div class="pr-group">${U.esc(g.label)} · ${g.total}</div>`; g.items.forEach(x => { items.push({ run: () => Records.open(x.c, x.id) }); html += `<div class="pr-item" data-i="${items.length - 1}">${I(g.icon, 'sm')}<span class="ellipsis">${U.hl(x.title, q.split(/\s+/)[0])}${x.archived ? ' <span class="badge">archived</span>' : ''}</span><span class="pr-sub">${U.esc(x.sub || '')}</span></div>`; }); if (g.total > g.items.length && Records.route[g.c]) { items.push({ run: () => Router.go(Records.route[g.c] + (['tasks', 'notes', 'contacts', 'ideas', 'documents', 'journal'].includes(g.c) ? '?q=' + encodeURIComponent(q) : '')) }); html += `<div class="pr-item faint" data-i="${items.length - 1}">${I('arrow', 'sm')}<span>Show all ${g.total} in ${U.esc(g.label)}</span></div>`; } });
        html += `<div class="pr-group">Create</div>`;
        [['tasks', 'Create task'], ['notes', 'Create note'], ['events', 'Create event'], ['ideas', 'Save business idea']].forEach(([c, l]) => { items.push({ run: () => c === 'tasks' ? (Tasks.quick(q.trim(), { due: D.today() }), Toast.show('Task added to today')) : c === 'notes' ? Notes.create({ title: q.trim() }) : Form.open(c, null, { defaults: { [c === 'ideas' || c === 'events' ? 'title' : 'title']: q.trim() } }) }); html += `<div class="pr-item" data-i="${items.length - 1}">${I('plus', 'sm')}<span>${l}: <b>${U.esc(q.trim())}</b></span></div>`; });
        if (!groups.length) html = `<div class="empty">${I('search')}<div>No results for “${U.esc(q)}”</div></div>` + html;
      }
      res.innerHTML = html; sel = 0; mark();
    };
    const mark = () => { $$('.pr-item', res).forEach(el => el.classList.toggle('sel', +el.dataset.i === sel)); const s = $('.pr-item.sel', res); if (s) s.scrollIntoView({ block: 'nearest' }); };
    const go = i => { const it = items[i]; if (!it) return; m.close(true); it.run(); };
    inp.addEventListener('input', draw);
    inp.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); mark(); } else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); mark(); } else if (e.key === 'Enter') { e.preventDefault(); go(sel); } });
    res.addEventListener('click', e => { const el = e.target.closest('.pr-item'); if (el) go(+el.dataset.i); });
    draw(); setTimeout(() => inp.focus(), 20);
  }

/* ---------- Drag & drop (desktop; touch users get menu/buttons alternatives) ---------- */
const DnD = {
  src: null, handlers: {},
  init() {
    document.addEventListener('dragstart', e => { const el = e.target.closest && e.target.closest('[data-drag]'); if (!el) return; this.src = { type: el.dataset.drag, id: el.dataset.id, el }; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', el.dataset.id || ''); } catch (_) { } setTimeout(() => el.classList.add('dragging'), 0); });
    document.addEventListener('dragend', () => { if (this.src) this.src.el.classList.remove('dragging'); $$('.drag-over').forEach(x => x.classList.remove('drag-over')); this.src = null; });
    document.addEventListener('dragover', e => { if (!this.src) return; const z = e.target.closest('[data-drop]'); if (!z || z.dataset.drop !== this.src.type) return; e.preventDefault(); $$('.drag-over').forEach(x => x.classList.remove('drag-over')); const t = e.target.closest('[data-drag]'); (t && z.contains(t) && t !== this.src.el ? t : z).classList.add('drag-over'); });
    document.addEventListener('drop', e => { if (!this.src) return; const z = e.target.closest('[data-drop]'); if (!z || z.dataset.drop !== this.src.type) return; e.preventDefault(); const t = e.target.closest('[data-drag]'); const h = this.handlers[this.src.type]; const src = this.src; $$('.drag-over').forEach(x => x.classList.remove('drag-over')); if (h) h(src, z, t && z.contains(t) ? t : null); });
  },
  /* reorder helper: returns new ordered id list with src placed before target */
  reorder(ids, srcId, targetId) { const out = ids.filter(i => i !== srcId); const idx = targetId ? out.indexOf(targetId) : -1; if (idx < 0) out.push(srcId); else out.splice(idx, 0, srcId); return out; }
};
DnD.handlers.task = (src, zone, target) => {
  const ids = $$('[data-drag="task"]', zone).map(el => el.dataset.id); const order = DnD.reorder(ids, src.id, target ? target.dataset.id : null);
  order.forEach((id, i) => { const t = Store.get('tasks', id); if (t) t.order = i; }); Store.changed('tasks');
  if (zone.dataset.zone !== 'myday' && ui('tasks', {}).sort !== 'manual') { UI.tasks.sort = 'manual'; Toast.show('Switched to manual order'); }
  App.render();
};
DnD.handlers.kanban = (src, zone) => { const st = zone.dataset.status; const t = Store.get('tasks', src.id); if (!t || !st || t.status === st) return; if (st === 'done') Tasks.toggle(t.id); else Store.update('tasks', t.id, { status: st, doneAt: null }); if (t.projectId) Projects.log(t.projectId, `Moved “${t.title}” to ${labelOf(TASK_STATUS, st)}`); };

/* Global listeners */
function bindGlobal() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el) return; const fn = A[el.dataset.a]; if (!fn) return;
    if (el.tagName === 'BUTTON' || (el.tagName === 'A' && !el.getAttribute('href'))) e.preventDefault();
    try { fn(el, e); } catch (err) { console.error(err); Toast.show('Action failed: ' + err.message, { error: true }); }
  });
  document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el, e); });
  document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el, e); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('[data-quicktask]')) { const title = e.target.value.trim(); if (!title) return; let d = {}; try { d = JSON.parse(e.target.dataset.quicktask); } catch (_) { } Tasks.quick(title, d); e.target.value = ''; Toast.show('Task added'); return; }
    if (e.key === 'Enter' && e.target.matches('[data-enter]')) { const fn = A[e.target.dataset.enter]; if (fn) { e.preventDefault(); fn(e.target, e); } return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!$('.palette')) Search.open(); return; }
    if (e.key === 'Escape') { if (Menu.el) return Menu.close(); if (QuickAdd.el) return QuickAdd.close(); const m = Modal.top(); if (m) { e.preventDefault(); m.close(); } return; }
    const typing = e.target.closest('input, textarea, select, [contenteditable="true"]'); if (typing || e.ctrlKey || e.metaKey || e.altKey || Modal.top()) return;
    if (e.key === '/') { e.preventDefault(); Search.open(); }
    else if (e.key.toLowerCase() === 'q') { e.preventDefault(); QuickAdd.toggle(); }
    else if (e.key.toLowerCase() === 'n') { e.preventDefault(); Form.open('tasks', null, { defaults: { due: D.today() } }); }
  });
  $('#fab').innerHTML = I('plus'); $('#fab').addEventListener('click', () => QuickAdd.toggle());
  $('#scrim').addEventListener('click', () => document.body.classList.remove('nav-open'));
  window.addEventListener('hashchange', () => { Modal.closeAll(); Menu.close(); App.render(); });

  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (Settings.get('theme') === 'system') { App.theme(); App.topbar(); App.render(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) Store.save.flush(); });
  window.addEventListener('beforeunload', () => Store.save.flush());
  Bus.on('change', () => App.schedule());
  Bus.on('settings', k => { if (['theme', 'accent', 'language'].includes(k)) { App.theme(); App.topbar(); App.sidebar(); } if (k === 'name') App.sidebar(); App.render(); });
  Bus.on('record', (c, item, op) => { if (c === 'notes' && item && op !== 'remove' && item.content !== undefined) item.plain = U.text(item.content).slice(0, 4000); if (c === 'projects' && op === 'add' && !(item.activity || []).length) item.activity = [{ ts: Date.now(), text: 'Project created' }]; if (c === 'tasks' && op === 'add' && item.projectId) Projects.log(item.projectId, `Added task “${item.title}”`); });
}

const GoalPlanner = {
  open(title) {

      { k: 'category', l: 'Life category', t: 'select', o: () => opt(LIFE_CATS), def: 'Business' }, { k: 'horizon', l: 'Planning period', t: 'select', o: HORIZONS, def: '3y' },

      { k: 'nTasks', l: 'How many milestones become tasks now?', t: 'number', min: 1, def: 2, showIf: v => v.mkTasks }
    ];
    const vals = Form.defaults(fields, { title });
    const m = Modal.open({ title: 'Plan an ambition', size: 'wide', guard: true, body: `<p class="small muted mb-16">Break a big ambition into milestones. The planner creates a goal, an optional project and the first tasks — so your long-term vision shows up in My Day.</p><form>${Form.html(fields, vals)}</form>`, footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" data-ok>${I('spark', 'sm')}Create plan</button>` });

      else if (v.mkTasks) steps.slice(0, Math.max(1, v.nTasks || 1)).forEach((t, i) => Tasks.quick(t, { goalId: g.id, due: D.add(D.today(), i * 2 + 1), priority: v.priority }));

  languages() {

  },
  body() {
    const td = D.today(); const log = Store.all('dailyLogs').find(x => x.date === td) || {}; const goal = Settings.get('waterGoal') || 8; const days = D.range(D.add(td, -13), td); const L = d => Store.all('dailyLogs').find(x => x.date === d) || {};
    const sleepH = l => { if (!l.sleepBed || !l.sleepWake) return null; let m = D.mins(l.sleepWake) - D.mins(l.sleepBed); if (m < 0) m += 1440; return Math.round(m / 6) / 10; };
    const sh = days.map(d => sleepH(L(d))).filter(x => x != null);
    return `<div class="grid g2"><div class="card card-pad"><div class="row between"><h3>${I('drop', 'sm')} Water today</h3><span class="num"><b>${log.water || 0}</b> / ${goal} glasses</span></div><div class="row wrap gap-6 mt-12">${[...Array(Math.max(goal, log.water || 0))].map((_, i) => `<button class="hcell ${i < (log.water || 0) ? 'on' : ''}" style="--c:#0ea5e9;margin:0" data-a="water-set" data-n="${i < (log.water || 0) && i === (log.water || 0) - 1 ? i : i + 1}" aria-label="Glass ${i + 1}">${i < (log.water || 0) ? I('drop', 'sm') : ''}</button>`).join('')}<button class="btn sm" data-a="water-set" data-n="${(log.water || 0) + 1}">+1</button></div>${Chart.progress(U.pct(log.water || 0, goal))}<div class="mt-16">${Chart.mount('bar', { labels: days.map(d => D.fmt(d, 'short')), series: [{ name: 'Glasses', values: days.map(d => L(d).water || 0), color: '#0ea5e9' }], height: 140, fmt: v => Math.round(v), tip: v => v + ' glasses' })}</div></div>
      <div class="card card-pad"><div class="row between"><h3>${I('bed', 'sm')} Sleep</h3><span class="small faint">Goal ${Settings.get('sleepGoal') || 8} h · avg ${sh.length ? U.avg(sh).toFixed(1) : '—'} h</span></div><div class="row wrap mt-12"><div class="field"><label>Went to bed (last night)</label><input type="time" class="input sm" value="${log.sleepBed || ''}" data-ch="sleep" data-k="sleepBed"></div><div class="field"><label>Woke up</label><input type="time" class="input sm" value="${log.sleepWake || ''}" data-ch="sleep" data-k="sleepWake"></div><div class="field"><label>Quality</label>${H.select('q', [{ v: '', l: '—' }, ...MOODS.map(m => ({ v: m[0], l: m[1] + ' ' + m[2] }))], log.sleepQuality || '', 'data-ch="sleep" data-k="sleepQuality"')}</div></div>${sleepH(log) != null ? `<p class="mt-8">Slept <b>${sleepH(log)} h</b> last night.</p>` : ''}<div class="mt-16">${Chart.mount('bar', { labels: days.map(d => D.fmt(d, 'short')), series: [{ name: 'Hours', values: days.map(d => sleepH(L(d)) || 0), color: '#8b5cf6' }], height: 140, fmt: v => v.toFixed(0), tip: v => v + ' h' })}</div></div></div>`;
  },
  logFor(d) { return Store.all('dailyLogs').find(x => x.date === d); },
  setLog(d, patch) { const l = this.logFor(d); if (l) Store.update('dailyLogs', l.id, patch); else Store.add('dailyLogs', { date: d, ...patch }); }
};

const Shopping = {
  buy(id) {
    const s = Store.get('shopping', id); if (!s) return;
    if (s.purchased) { if (s.txId) Store.remove('transactions', s.txId, { silent: true }); Store.update('shopping', id, { purchased: false, purchasedAt: null, txId: null }); return; }
    const patch = { purchased: true, purchasedAt: D.today() }; const amt = U.round2((s.actualPrice ?? s.price ?? 0) * (s.qty || 1));
    if (Settings.get('shopToBudget') && amt > 0) { const tx = Store.add('transactions', { kind: 'expense', amount: amt, currency: s.currency || Settings.get('currency'), date: D.today(), category: s.category || 'Shopping', description: s.name, note: 'From shopping list', tags: ['shopping'], shopId: s.id }, { silent: true }); patch.txId = tx.id; }
    Store.update('shopping', id, patch); Toast.show(patch.txId ? `Purchased · ${Money.fmt(amt, s.currency)} added to your budget` : 'Marked as purchased', { action: { l: 'Undo', fn: () => Shopping.buy(id) } });
  },
  total: items => Money.total(items, x => (x.price || 0) * (x.qty || 1), x => x.currency).total
};

V.travel = {
  title: r => r.args[0] ? (titleOf('trips', Store.get('trips', r.args[0])) || 'Trip') : T('Travel'),

    const td = D.today(); const ts = Store.all('trips'); const up = U.sortBy(ts.filter(t => !t.end || t.end >= td), t => t.start || '9999'); const past = U.sortBy(ts.filter(t => t.end && t.end < td), t => t.start, -1);

};

const MAX_FILE = 50 * 1024 * 1024;
const Docs = {
  icon: d => /^image\//.test(d.mime) ? 'image' : 'file',
  async upload(files, defs = {}) {
    let n = 0;
    for (const f of files) {
      if (f.size > MAX_FILE) { Toast.show(`“${f.name}” is larger than 50 MB and was skipped`, { error: true }); continue; }
      const id = U.uid();
      try { await Store.putFile(id, f); } catch (e) { Toast.show('Could not store file: ' + e.message, { error: true }); continue; }
      let thumb = null; if (/^image\//.test(f.type) && f.size < 15e6) thumb = await U.resizeImage(f, 96);
      Store.add('documents', { id, name: f.name.replace(/\.[^.]+$/, ''), fileName: f.name, mime: f.type || 'application/octet-stream', size: f.size, category: defs.category || 'Personal', date: D.today(), tags: [], description: '', thumb, ...defs }); n++;
    }
    if (n) Toast.show(`${U.plural(n, 'document')} uploaded`);
    if (Store.mode !== 'indexeddb' && n) Toast.show('IndexedDB is unavailable — files are kept only until you close this tab', { error: true, ms: 8000 });
  },
  pick(defs) { const inp = $('#hiddenFile'); inp.value = ''; inp.multiple = true; inp.accept = ''; inp.onchange = () => Docs.upload([...inp.files], defs); inp.click(); },
  async blob(id) { const b = await Store.getFile(id); if (!b) throw new Error('File data not found in this browser'); return b; },
  async download(id) { const d = Store.get('documents', id); try { U.download(d.fileName || d.name, await this.blob(id)); } catch (e) { Toast.show(e.message, { error: true }); } },
  async preview(id) {
    const d = Store.get('documents', id); if (!d) return; Recent.add('documents', id); let url = null, inner = '';
    try { const b = await this.blob(id); url = URL.createObjectURL(b);
      if (/^image\//.test(d.mime)) inner = `<img src="${url}" alt="" style="max-width:100%;max-height:65vh;display:block;margin:auto;border-radius:8px">`;
      else if (d.mime === 'application/pdf') inner = `<iframe src="${url}" title="PDF preview" style="width:100%;height:65vh;border:1px solid var(--border);border-radius:8px" sandbox="allow-same-origin allow-scripts allow-downloads"></iframe>`;
      else if (/^text\/|json|csv|xml|markdown/.test(d.mime) && d.size < 2e6) inner = `<pre style="white-space:pre-wrap;max-height:60vh;overflow:auto;background:var(--surface-2);padding:12px;border-radius:8px;font-size:12.5px">${U.esc(await b.text())}</pre>`;
      else if (/^audio\//.test(d.mime)) inner = `<audio controls src="${url}" style="width:100%"></audio>`;
      else if (/^video\//.test(d.mime)) inner = `<video controls src="${url}" style="width:100%;max-height:60vh"></video>`;
      else inner = H.empty('Preview is not available for this file type. Download it to open.', 'file');
    } catch (e) { inner = H.empty(U.esc(e.message) + '. The file may have been removed when browser data was cleared.', 'alert'); }
    const p = Store.get('projects', d.projectId), b = Store.get('businesses', d.businessId);
    const m = Modal.open({ title: U.esc(d.name), size: 'wide', onClose: () => url && URL.revokeObjectURL(url), body: `${inner}<dl class="kv mt-16"><dt>File</dt><dd>${U.esc(d.fileName || '')} · ${U.bytes(d.size)} · ${U.esc(d.mime || '')}</dd><dt>Category</dt><dd>${U.esc(d.category)}</dd><dt>Date</dt><dd>${D.fmt(d.date)}</dd>${d.expiry ? `<dt>Expires</dt><dd class="${d.expiry < D.today() ? 'neg' : ''}">${D.fmt(d.expiry)}</dd>` : ''}${d.description ? `<dt>Description</dt><dd>${U.esc(d.description)}</dd>` : ''}${(d.tags || []).length ? `<dt>Tags</dt><dd>${d.tags.map(t => `<span class="tag">${U.esc(t)}</span>`).join(' ')}</dd>` : ''}${p ? `<dt>Project</dt><dd><a href="#/projects/${p.id}">${U.esc(p.title)}</a></dd>` : ''}${b ? `<dt>Business</dt><dd><a href="#/business/${b.id}">${U.esc(b.name)}</a></dd>` : ''}</dl>`, footer: `<button class="btn danger" data-del style="margin-right:auto">${I('trash', 'sm')}Delete</button><button class="btn" data-edit>${I('edit', 'sm')}Edit details</button><button class="btn primary" data-dl>${I('download', 'sm')}Download</button>` });
    m.root.querySelector('[data-dl]').onclick = () => this.download(id);

  }
};
Object.assign(A, { 'doc-upload': el => { let d = {}; try { d = JSON.parse(el.dataset.def || '{}'); } catch (_) { } Docs.pick(d); }, 'doc-dl': el => Docs.download(el.dataset.id) });

        <div class="table-wrap"><table class="tbl"><thead><tr><th>Month</th><th class="r">Income</th><th class="r">Expenses</th><th class="r">Net</th><th class="r">Savings rate</th></tr></thead><tbody>${data.map(x => `<tr><td>${D.fmt(x.mk + '-01', 'month')}</td><td class="r num">${Money.fmt(x.income)}</td><td class="r num">${Money.fmt(x.expenses)}</td><td class="r num ${x.net < 0 ? 'neg' : 'pos'}">${Money.fmt(x.net)}</td><td class="r num">${x.income ? U.pct(x.net, x.income) + '%' : '—'}</td></tr>`).join('')}</tbody></table></div>`;

};

const APP_VERSION = '1.0.0';

/* ---------- Report builder: summarises REAL data for any date range ---------- */
const Report = {
  build(from, to) {
    const inR = d => d && d >= from && d <= to; const tsDay = ts => ts ? D.key(new Date(ts)) : null;
    const tasks = Store.all('tasks'); const done = tasks.filter(t => inR(tsDay(t.doneAt))); const created = tasks.filter(t => inR(tsDay(t.createdAt)));
    const unfinished = tasks.filter(t => !t.archived && !Tasks.isDone(t) && t.due && t.due <= to && t.due >= D.add(from, -30));
    const journal = Store.all('journal').filter(j => inR(j.date) && !(j.private && Journal.isLocked()));
    const tx = Store.all('transactions').filter(t => inR(t.date)); const income = Money.total(tx.filter(t => t.kind === 'income')).total, expenses = Money.total(tx.filter(t => t.kind === 'expense')).total;
    const days = D.range(from, to > D.today() ? D.today() : to); const hab = days.map(d => Habits.dayRate(d)); const habitPct = U.pct(U.sum(hab, x => x.d), U.sum(hab, x => x.n));
    const biz = Store.all('businesses').filter(b => !b.archived).map(b => { const xs = Biz.tx(b.id).filter(x => inR(x.date) && x.status !== 'unpaid'); const rev = U.round2(U.sum(xs.filter(x => x.kind === 'revenue'), x => Biz.conv(x, b))), exp = U.round2(U.sum(xs.filter(x => x.kind === 'expense'), x => Biz.conv(x, b))); const tdone = done.filter(t => t.businessId === b.id).length; return { b, rev, exp, profit: U.round2(rev - exp), tdone, n: xs.length }; });
    const goalsAchieved = Store.all('goals').filter(g => g.status === 'achieved' && inR(tsDay(g.achievedAt)));
    const msDone = []; Store.all('projects').forEach(p => (p.activity || []).filter(a => inR(tsDay(a.ts)) && /milestone/i.test(a.text) && /Completed/.test(a.text)).forEach(a => msDone.push({ p, text: a.text })));
    const study = School.minutes(from, to); const workouts = Store.all('workouts').filter(w => inR(w.date)); const events = Events.occurrences(from, to);
    const learned = journal.map(j => j.a_learned).filter(Boolean); const grateful = journal.map(j => j.a_grateful).filter(Boolean);
    const moods = journal.filter(j => j.mood);
    return { from, to, done, created, unfinished, journal, income, expenses, net: U.round2(income - expenses), tx, cats: Finance.byCategory(tx), habitPct, habitN: U.sum(hab, x => x.n), biz, goalsAchieved, msDone, study, workouts, events, learned, grateful, mood: moods.length ? U.avg(moods, j => j.mood) : null, notes: Store.all('notes').filter(n => inR(tsDay(n.createdAt))), ideas: Store.all('ideas').filter(i => inR(tsDay(i.createdAt))) };
  },
  html(r, { compact } = {}) {
    const cur = Settings.get('currency');
    return `<div class="grid g4 mb-16">${H.stat('Tasks completed', r.done.length, `${r.created.length} created`, 'check')}${H.stat('Habit consistency', r.habitN ? r.habitPct + '%' : '—', '', 'repeat')}${H.stat('Journal entries', r.journal.length, r.mood ? `avg mood ${r.mood.toFixed(1)}/5` : '', 'journal')}${H.stat('Net (personal)', Money.fmt(r.net), `${Money.fmt(r.income, null, 0)} in · ${Money.fmt(r.expenses, null, 0)} out`, 'wallet', r.net < 0 ? 'neg' : '')}</div>
      <div class="grid g4 mb-16">${H.stat('Study time', (Math.round(r.study / 6) / 10) + ' h', '', 'school')}${H.stat('Workouts', r.workouts.length, U.sum(r.workouts, w => w.duration) + ' min', 'dumbbell')}${H.stat('Events', r.events.length, '', 'calendar')}${H.stat('Goals achieved', r.goalsAchieved.length, r.msDone.length + ' project milestones', 'target')}</div>
      ${compact ? '' : `<div class="grid g2">${H.card(`Completed tasks · ${r.done.length}`, r.done.length ? U.sortBy(r.done, t => t.doneAt, -1).slice(0, 25).map(t => `<div class="mini-li small">${I('check', 'sm')}<span class="t">${U.esc(t.title)}</span><span class="faint">${D.fmt(D.key(new Date(t.doneAt)), 'short')}</span></div>`).join('') + (r.done.length > 25 ? `<div class="tiny faint mt-8">+${r.done.length - 25} more</div>` : '') : '<div class="small faint">No completed tasks recorded in this period.</div>')}${H.card(`Unfinished tasks · ${r.unfinished.length}`, r.unfinished.length ? r.unfinished.slice(0, 20).map(t => `<div class="mini-li small" style="cursor:pointer" data-a="task-edit" data-id="${t.id}">${I('alert', 'sm')}<span class="t">${U.esc(t.title)}</span><span class="neg">${D.fmt(t.due, 'short')}</span></div>`).join('') : '<div class="small faint">Nothing left unfinished. </div>')}
        ${H.card('Businesses', r.biz.length ? `<table class="tbl"><thead><tr><th>Business</th><th class="r">Revenue</th><th class="r">Expenses</th><th class="r">Profit</th><th class="r">Tasks done</th></tr></thead><tbody>${r.biz.map(x => `<tr><td>${U.esc(x.b.name)}</td><td class="r num">${Money.fmt(x.rev, x.b.currency, 0)}</td><td class="r num">${Money.fmt(x.exp, x.b.currency, 0)}</td><td class="r num ${x.profit < 0 ? 'neg' : 'pos'}">${Money.fmt(x.profit, x.b.currency, 0)}</td><td class="r num">${x.tdone}</td></tr>`).join('')}</tbody></table>` : '<div class="small faint">No businesses.</div>')}${H.card('Money', r.tx.length ? Chart.hbars(r.cats.slice(0, 6).map(c => ({ ...c, display: Money.fmt(c.value, cur, 0) }))) : '<div class="small faint">No personal transactions recorded.</div>')}
        ${r.learned.length || r.grateful.length ? H.card('From your journal', (r.learned.length ? `<div class="flabel mb-8">What I learned</div>${r.learned.slice(0, 8).map(x => `<p class="small mb-8">• ${U.esc(U.trunc(x, 200))}</p>`).join('')}` : '') + (r.grateful.length ? `<div class="flabel mb-8 mt-12">What I was grateful for</div>${r.grateful.slice(0, 6).map(x => `<p class="small mb-8">• ${U.esc(U.trunc(x, 200))}</p>`).join('')}` : '')) : ''}${r.goalsAchieved.length || r.msDone.length ? H.card('Achievements', r.goalsAchieved.map(g => `<div class="mini-li small">${I('target', 'sm')}<span class="t">Goal achieved: ${U.esc(g.title)}</span></div>`).join('') + r.msDone.map(m => `<div class="mini-li small">${I('layers', 'sm')}<span class="t">${U.esc(m.text)} — ${U.esc(m.p.title)}</span></div>`).join('')) : ''}</div>`}`;
  },
  text(r, title) {
    const L = [title, `${D.fmt(r.from, 'long')} – ${D.fmt(r.to, 'long')}`, '', `Tasks completed: ${r.done.length} (created ${r.created.length})`, ...r.done.map(t => '  ✓ ' + t.title), `Unfinished: ${r.unfinished.length}`, ...r.unfinished.map(t => '  • ' + t.title + ' (due ' + D.fmt(t.due) + ')'), '', `Habit consistency: ${r.habitN ? r.habitPct + '%' : 'n/a'}`, `Journal entries: ${r.journal.length}`, `Study time: ${Math.round(r.study / 6) / 10} h`, `Workouts: ${r.workouts.length}`, '', `Personal income: ${Money.fmt(r.income)}`, `Personal expenses: ${Money.fmt(r.expenses)}`, `Net: ${Money.fmt(r.net)}`, ...r.cats.slice(0, 8).map(c => `  ${c.label}: ${Money.fmt(c.value)}`), '', 'Businesses:', ...r.biz.map(x => `  ${x.b.name}: revenue ${Money.fmt(x.rev, x.b.currency)}, expenses ${Money.fmt(x.exp, x.b.currency)}, profit ${Money.fmt(x.profit, x.b.currency)}`), '', `Goals achieved: ${r.goalsAchieved.map(g => g.title).join(', ') || 'none'}`];
    return L.join('\n');
  },
  period(type, date) { if (type === 'daily') return [date, date]; if (type === 'weekly') { const s = D.weekStart(date); return [s, D.add(s, 6)]; } if (type === 'monthly') return [D.monthStart(date), D.monthEnd(date)]; return [date.slice(0, 4) + '-01-01', date.slice(0, 4) + '-12-31']; },
  shift(type, date, n) { return type === 'daily' ? D.add(date, n) : type === 'weekly' ? D.add(date, 7 * n) : type === 'monthly' ? D.addMonths(D.monthStart(date), n) : D.addYears(date, n); }
};
